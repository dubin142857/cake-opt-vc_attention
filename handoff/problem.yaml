      ★结论: **单独把几何改到 128×128 是回退**。Laser 的 128×128 之所以成立, 是因为它同时
      (a) 把 O 累加在 L0C 故没有"每 key tile 写一次 O"这条流, (b) 处处双缓冲, (c) 手写 cube 无 API 开销。
      **三件事是一件事, 拆开做第一步就会退。** 这一条此前只是推断, 现在有实测点。
    finding_2_scalar_is_per_call: >
      ★scalar 与 **matmul 调用次数**成正比, 不与字节成正比:
        N 由 256 改 128 使 tile 数翻倍, scalar 238032 -> 423321 (×1.78, 近似线性)。
      ★这坐实 F188 的机制判断: scalar 是 per-call 的 API 控制开销, 不是跨核等待也不是数据量。
      ★N=512 M=32 的 tile 总数与 N=256 M=64 相同 (87320/head), scalar 却高 1.5 倍 ——
        因为 PV 的 B 在 N=512 时是 512×128 half = 128 KB > L0B 的 64 KB, MatmulImpl 必须
        **内部再切分**, 于是单次 IterateAll 里 Iterate() 迭代更多次。
        决策规则: **让单次 matmul 调用覆盖尽量多的工作, 但不得超出 L0 导致内部切分**。
    finding_3_we_are_tight_against_our_own_floor: >
      ★窗口/binding: ours 四个点是 1.052 / 1.164 / 1.168 / 1.315, laser 是 1.390。
      **我们比 Laser 更紧**。调度压榨不是问题, 问题全在下界 (scalar 238032 vs laser 的 cube 53594)。
      四个点的 binding 全是 scalar (或 aiv_scalar), 没有一个是 cube 或 fixpipe。
    decision_rule: >
      在 MatmulImpl + db 全关的现结构下, 已测四点中 **N=256 M=64 是最优**(aic_time 最小)。
      任何几何改动**必须与手写 cube 同时落地**, 否则按 N=128 那个点的实测会退 2 倍。
      下一步的第一个增量因此不能是"只改几何"或"只改握手", 必须是:
        手写 cube (去 API 开销) + 128×128 (使 L0 各缓冲半满可双缓冲) + O 常驻 L0C (抵消 N 变小带来的 O 翻倍)
      三者同时。预期 fixpipe 流量 ≈ S 的 149.2 GB (O 近零), 已优于基线 223.8;
      scalar 因 API 开销消失而大幅下降 —— 两个方向都不回退。
    lesson: >
      ★"组合优化项"不能按单项收益排序后逐项上。本案三项里有两项**单独做是负收益**
      (几何改小使 O 翻倍; 双缓冲在旧几何下 L0B 超容根本开不了), 只有合起来才正。
      判断方法: 先问"这一项单独上, 哪条流量或哪条 pipe 会变差", 有答案就不能单独上。

  - id: F190
    t: 2026-10-29
    kind: result
    title: "★chunk 内单一 rowmax 与 expcast 的有限动态范围冲突: 3 个 tile 一组时 RMSE 1.87% 超闸"
    context: >
      为让 O 在 L0C 上跨 key 块累加 (F186/F189 的 148 倍频次差的解法), 向量侧改成
      chunk 内用**单一** rowmax。设计时判断"精度无新风险", 理由是现有 bmax 已是
      运行全局最大, 而 chunk 最大 <= 全局最大。**该判断对 control 成立, 对 expcast 不成立。**
    measured: >
      141 例验收跑到第 12 例失败, 前 11 例全过:
        expcast=False  n=6  最大 RMSE 2.1e-4   (闸 1e-2; 基线 7e-5)
        expcast=True   n=5  最大 RMSE 1.0e-5
        ★第 12 例 dtype=fp16 dim=64 q=65 k=257 **expcast=True**: RMSE **1.87%** 超闸
      keys=257 -> kpad=384 -> tiles=3 -> 这是**第一个 3 个 tile 挤在一个 chunk** 的用例;
      tiles<=2 的全过, 且**同形状的 expcast=False 过了** (在那 6 例的 2.1e-4 之内)。
    mechanism: >
      expcast 把 score*EXPCAST_GAIN + 120 编成 E4M3 码, 并由 Maxs(score, 0) 钳住下界,
      即 score < -120/GAIN ≈ -10.4 的元素一律落到码 0 (值 0)。
      chunk 内用单一 rowmax 时, 靠前、自身最大值偏小的块被压得更低,
      落进钳位区的元素随 chunk 内最大值的跨度增大而增多。
      ★原代码 H25 的注释已写明"上界永远不会被触到", 并提示"若将来改动 rowmax 的定义,
        这条删除就不再成立" —— 本次改的正是 rowmax 的定义, 而出问题的是**下界**那一侧。
    not_yet_decided: >
      这是契约层面的取舍, 未自行决定。已知选项与各自代价:
      (a) expcast 退回每 tile 一个 rowmax —— 那它就不能用 L0C 累加, 等于 CHUNK=1,
          而 CHUNK=1 的 fixpipe 是 297.4 GB (比基线 223.8 还差)。
      (b) expcast 单独用 CHUNK=2 —— fixpipe 223.3 GB ≈ 基线, 即 expcast 没有收益,
          control 保持 CHUNK=4。代价是 workspace 要按变体分支。
      (c) 调 EXPCAST_GAIN 放宽下界 —— 它是**数值契约**的一部分 (E4M3 编码),
          放宽范围会同时降低分辨率, 需要重新标定, 且影响已交付的精度口径。
      (d) 接受并声明 expcast 在大 chunk 下的适用范围。
      ★(a) 与 (b) 都使 expcast 失去本次改造的收益; (c) 动契约; (d) 缩适用范围。
        没有一个是无代价的, 故不自行拍板。
    state: >
      分支 r1-laser-dataflow 当前**未过验收闸** —— 已知失败是上述一条, 且只在 expcast
      且 chunk 内 tile 数 >= 3 时出现。control 路径 (交付主路径) 的 6 例最大 2.1e-4,
      与基线 7e-5 同量级。回退点 tag delivery-h26-bitdecode (e2fc535, 产物 3494c48d)。
    CORRECTION_same_day: >
      ★上面 not_yet_decided 列的四个选项**全部作废** —— 那是把一处**镜像常量失配**
        误判成了契约取舍。读 reference.py 的函数签名就看见:
          def payload_reference(payload, *, expcast=True, query_indices=None, tile_width=None)
          """tile_width 是**在线更新的粒度**, 默认取 K_TILE, 即内核的 K 方向 matmul tile 宽度。
             ... 普通 exp 路径对宽度不变, 故只有 ExpCast 受影响。"""
        参考的窗口**按定义就该等于内核的归一化窗口**, 作者还写明了只有 ExpCast 受影响。
        我把内核的窗口由 N 改成 N*CHUNK=512, 却没改参考的默认值 (仍 K_TILE=128) ——
        于是尺子与被测者用了不同的窗口。这与 K_TILE 本身是同一类"同一个量写两处"。
      ★这不是搬动标尺: decoded_reference 的职责是**隔离实现误差**, 所以它的窗口必须
        跟随实现; 客户端口径的 dense_fp32 与窗口无关 (它比的是全精度参考)。
      修法: reference.py 加 CHUNK 镜像常量与 ONLINE_TILE = K_TILE * CHUNK, 默认窗口改用它。
      修后**全量 141 例通过**: status=passed, decoded_reference 最大 **9.5e-5** 超闸 0 例
      (基线 7e-5), dense_fp32 最大 0.0463 / 中位 0.0286 —— **与基线逐项相同**。
      expcast 的 dense 中位 0.0422 (基线 0.0436), 略好。
    lesson_corrected: >
      ★真正的教训不是"精度要分路径验", 而是**改了一个量, 要把它的全部镜像一起找出来**。
        本次 N 的镜像有四处: vc_tiling.h 的 N · reference.py 的 K_TILE ·
        api.py 的 tile_m 默认 · ★**参考的在线更新窗口** —— 前三处我都想到了, 漏了第四处,
        而它恰恰是唯一会表现为"数值错"而不是"形状错"的那一处, 于是最难归因。
      ★第二条: 我在 not_yet_decided 里列了四个带代价的选项并声称"没有一个是无代价的,
        故不自行拍板" —— 那个框架本身是错的, 因为我**没有先去读参考实现的接口**。
        教训二 (动手前先读接口) 不只适用于写代码, 也适用于**判定一件事是不是取舍**。
    lesson: >
      ★(已被上面的 CORRECTION 取代, 原文保留存证) "精度无新风险"这类判断要分路径验。
      本次的推理 "chunk 最大 <= 全局最大, 故只会更好" 对 control 是对的,
      却漏掉了 expcast 在**下界**有一个硬钳位 —— 同一个改动在两条数值路径上后果相反。
      代码注释里我写了"下溢风险按闸实测", 方向是对的, 但**没有在设计阶段就把 expcast
      单列出来算**, 于是把一个可预见的冲突留给了验收去发现。

  - id: F191
    t: 2026-10-29
    kind: result
    title: "★两条 E9 预期全中, 但 binding 换成 mte2 且窗口/binding 由 1.164 劣化到 2.322 —— 慢的是重叠不是流量"
    artifact: "产物指纹 822b74f6; msprof 用 --kernel-name=vc910_forward_m64 定向采, 四族 + ResourceConflictRatio。"
    E9_both_held: >
      ★两条测前写定的预期**分别核, 都成立**:
        (1) aic_scalar_ratio 0.859 -> **0.158** (降 5.4 倍)。忙时 238032 -> 62175 us。
            即 F188 判定的"单 tile 252.5 ticks 里 matmul API 占 251.5, API 开销 80%"确实消失。
        (2) L0C_to_GM_datas 223.8 -> **186.0 GB**, 预测 186.3, **差 0.2%** (容差 2%)。
            即 chunk 内 O 在 L0C 累加、只在 chunk 末搬出一次, 确实生效。
    but_still_slower: >
      aic_time 392732 vs 基线 276959 (1.42x); 端到端 core 400.79 vs 285.46 ms (1.40x)。
      ★慢的成因**不在流量**, 在重叠:
        AIC 四条流水占比之和 1.48 -> **0.96** —— 平均连一条流水都没占满, 即**完全串行**。
        binding pipe 由 scalar(238032) 换成 **mte2(169161)**。
        窗口/binding 由 1.164 **劣化到 2.322** —— 窗口 392732 而 max(pipe) 只有 169161,
        **2.32 倍是纯粹的不重叠**。
      成因明确: 本版每一次搬运都用 **_sync 变体** (内嵌同步, 每次自等自己),
      且 V 装载后还有一道 asc_sync() 全屏障。双缓冲**尚未开启**。
    aic_read_rose_and_why: >
      AIC 读 317.1 -> **334.6 GB**, 逐项对得上:
        N 由 256 减半使 key tile 数翻倍, 而 **Q 对每个 key tile 重读一次**,
        故 Q 读 18.7 -> 37.4; K(74.6) / P(74.6) / V(149.2) 三项不变。
        37.4 + 74.6 + 74.6 + 149.2 = 335.8 ≈ 实测 334.6。
      ★这是 N=128 的固有代价, 已计入。但它现在还不是瓶颈 (mte2 忙时 169161 中含它)。
    decision_rule: >
      ★下一步**只做一件事**: 换手动 set_flag/wait_flag 的 ping/pong 双缓冲, 去掉 asc_sync() 全屏障。
        依据: 唯一劣化的指标是重叠 (四流水和 0.96, 窗口/binding 2.322),
        而两条流量指标都已达预期。**流量对了而时间没好 = 问题在重叠不在流量** (本轮的判别规则)。
      ★完美重叠下的地板是 max(pipe) = mte2 **169161 us ≈ 169 ms**, 而基线窗口是 277 ms ——
        即重叠修好后有望**显著低于基线**, 这是继续做下去的依据, 不是指望。
      ★再下一个目标随之确定: 修好重叠后 binding 是 mte2 (Laser 的 mte2 只有 42433),
        候选是 Q 的重读 (37.4 GB) 与 V 的重读 (149.2 GB, 占 AIC 读 45%)。
    lesson: >
      ★"改对了但更慢"要能分解成**流量**与**重叠**两项分别核, 否则会误判成"方向错了"。
        本轮两条流量指标全中而端到端退 40%, 若只看端到端就会退回旧结构,
        而实际上地板已由 238032 降到 169161, 只差把重叠做出来。
      ★msprof 的 --launch-count 截的是**最前面 N 个核**, 而 prepare() 自己会启动
        Cast / IsFinite 等算子, 于是第一次采到的全不是目标核 (产物非空、rc=0, 看着像成功)。
        用 --kernel-name 定向采。这是教训八在 msprof 上的又一个形态。

  - id: F192
    t: 2026-10-29
    kind: ops
    title: "★挂死的内核把共用的 1 号卡置成 Alarm; 以及 pgrep -f / pkill -f 会杀掉自己所在的 shell"
    what_happened: >
      QK 软件流水的第二个缺陷 (序幕没给 L1 的 PONG 槽发"可覆写"许可) 使内核在
      `q=33 k=129` 那一例挂死, AICore 100% 空转。清理过程中:
        (1) `pkill -f 'validate_ascend910b.py'` **把当前 shell 的进程组一起带下去** ——
            退出码 144, 且那一次的文件改动**没落地**, 差点以为改了其实没改。
        (2) 改用 `pgrep -f '...'` 取 PID 再 kill, **同样中招** ——
            模式串出现在**我自己这条命令的命令行里**, 于是把自己也匹配进去。
            安全取法: `ps -eo pid,comm,args --no-headers | awk '$2=="python3" && /关键词/ {print $1}'`,
            用 comm 字段把 shell 排除掉。
        (3) 进程清掉后 AICore 仍显示 100% 约一分钟; 跑一个最小矩乘后恢复 0%。
      ★后果: 1 号卡的 NPU 级 **Health 由 OK 变成 Alarm** (Chip 与 MCU 仍 OK,
        HBM ECC 单/双比特计数**全为 0**, 最小矩乘正常) —— 即不是硬件损伤,
        是 aicore 异常留下的**锁存状态**, 其余 0/2..7 号卡仍为 OK。
    rule: >
      ★改同步之后**不要直接跑全量 141 例**: 一次挂死要占卡数分钟, 还可能留下 Alarm。
        先跑**一个最小形状的单例**做烟测 (几十秒), 过了再上全量。
      ★清理挂死进程**不要用 pkill -f / pgrep -f 加会命中自身命令行的模式**。
      ★挂死后要核三件事再继续: 进程已清 · AICore 回 0 · 跑一个最小算子确认卡可用;
        并记下 Health 是否被置为 Alarm —— 这是共用硬件, 不能静默带过。
    lesson: >
      ★"排除一个分支"要问它在**当前这个用例上会不会被走到**。
        我先前怀疑过"序幕缺 L1 许可", 却因为"当时失败的是 n_in=1"而排除 ——
        而那个分支只在 **n_in>=2** 才走到, 用 n_in=1 的现象去排除它是无效推理。
        这与 F188 的"排除一条 pipe 要有当期证据"同形: 排除要基于**能覆盖它的证据**。

