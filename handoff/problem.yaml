  - id: F42
    t: 2026-10-26
    claim: >
      N 加宽的真正障碍在两侧填充口径不一致, 已核对清楚:
        Python 的 _quantize_blocks(kf, K_BLOCK=128) 把 K 填充到 **128 的倍数**
        (keys=37741 -> 37760), 并产出 ceil(n/128) 组 scale;
        host 要求 kp = ceil(keys/N)*N (vc_torch.cpp:47), 且 K scale 数检查写的是
        kp / N (:52) —— N=128 时两者恰好重合, 故此前一直成立。
      N=256 时 host 要 37888 行而 Python 只给 37760 行, 且 scale 数应为
      kp/K_SCALE_BLOCK=296 而非 kp/N=148。
    evidence:
      - kind: source
        ref: "ascend/vc_attention_ascend/api.py 的 _quantize_blocks; ascend/csrc/vc_torch.cpp:47,52"
    resolution: >
      让 Python 把 K/V 填充到 **N 的倍数**, 量化块仍按 K_SCALE_BLOCK=128 切
      (N 是 K_SCALE_BLOCK 的整数倍, 故多出的那一块覆盖的全是填充出来的零 token);
      host 的 scale 数检查改用 kp/K_SCALE_BLOCK。
      真实 token 的量化粒度不变, 填充 token 由既有尾块掩码 (valid = keys - key) 置 -inf,
      不影响结果。代价是 K/V 张量由 37760 增到 37888 行 (+0.34%)。

  - id: F43
    t: 2026-10-26
    claim: >
      h9b (N=256) 在 141 用例验收的 {fp16, dim 64, queries 65, keys 257, expcast True} 上失败:
      对 decoded reference 的 rRMSE 0.018718 (门限 0.01), max_abs 0.0129242;
      **同形状 expcast=False 通过, rRMSE 仅 0.000206**。
      隔离复跑确认: K 按 K_TILE=256 填充到 512 行、k_scale 4 块, 结构符合设计;
      误差散布在约半数 query 行 (head0 37/65, head1 29/65) 与全部通道, 量级 0.008,
      **不是某个 tile 整块错**, 故不是 scale 索引或尾块掩码写错。
    evidence:
      - kind: measurement
        ref: "vc-attention/results/iter10_h9b.log 的 AssertionError; scratchpad/h9b_localize.py 的隔离复跑"
    root_cause_identified: >
      ExpCast 的 E4M3 概率编码是**相对当前 tile 行最大值**定义的:
      score -> xEXPCAST_GAIN -> +120 -> Maxs(0) -> Mins(120) -> RINT -> 查表,
      低于 -120/GAIN 约 -10.4 的分数一律压成索引 0。tile 加宽后更多 key 与同一个
      (更大的) 行最大值比较, 被压成零的比例改变。
      而 CPU 参考 payload_reference 按 K_BLOCK=128 迭代在线更新
      (reference.py 的 `for tile, begin in enumerate(range(0, payload["keys"], K_BLOCK))`),
      即参考与内核对 tile 宽度的假设不再一致。
      普通 exp 路径在精确算术下对 tile 宽度不变, 故 control 只剩 fp32 重结合的 2e-4。
    implication: >
      **N 不只是性能参数, 它是 ExpCast 数值契约的一部分。**
      这一点此前没有被任何文档或断言记录, 是本次加宽才暴露出来的。
      可选处置: (甲) 把 ExpCast 的编码粒度与 matmul tile 宽度再解耦, 在 256 宽 tile 内
      分两个 128 子步各对子最大值编码, 恢复原契约但增加 Vector 工作;
      (乙) 只在 control 路径加宽; (丙) 接受新契约并同步改参考 —— 但那会使本侧参考与
      对端不一致, 且无法再声称契约未变。未经实测收益不做选择。

