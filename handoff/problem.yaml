    what_the_evidence_supports_instead: >
      约束是 AIV 的向量工作量。它的构成 (h26 expcast, us/tile):
        vec 2.0344 (占窗口 69%) / mte2 0.5835 / mte3 0.2435 / 标量 0.6039
      两条路, 都不是 KFC:
        (甲) **减少向量工作量**。我们比 FA 多出来的那 115230 us 几乎全在 ExpCast 这条
             E4M3 量化 softmax 的语义上 —— control 臂没有 LUT 也仍是 FA 的 1.49 倍。
             这是**数值契约**, 不是实现效率, 动它要甲方点头。
        (乙) **提高 AIV 的核内重叠** (1.18 -> 更高)。上界是让 mte2/mte3/标量全藏到 vec 下,
