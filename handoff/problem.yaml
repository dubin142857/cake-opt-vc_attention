        (a) `Axpy<float,half>` 的形参语义 —— **本条关闭**;
        (b) 标量是 fp16 -> qs 会被舍成 10 位尾数, 要并进离线模型重算 (不上卡);
        (c) 尾部掩码值 `-3.402823466e38f` 在 fp16 里不可表示, 要换成 fp16 的下界
            并核对 `exp(qs*(mask-m))` 仍下溢到 0;
        (d) "逐行填 `-qs*m`" 那一遍的**真实代价** —— 今天没有这一遍, 是新增的。
            ★F236 的教训就在这里: **遍数是计数, 不是时间**。这一项必须量, 不能算。
    next: >
