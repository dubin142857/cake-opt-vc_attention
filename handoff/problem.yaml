  - id: F149
    t: 2026-10-28
    severity: critical
    claim: >
      **硬件直接报出了成因: `L0B read/write conflict in the MTE (same address)`,
      aicore exception 507015。已交付的 h26b 上可复现 (512x4 的小形状, 2 次中 1 次)。
      这不只是非确定性, 是**硬失败**。**
    the_hardware_message: >
      `errcode:(0x8000004000, 0, 0) errorStr: L0B read/write conflict.`
      `L0B read/write conflict in the MTE (same address).`
      `Kernel task happen error, retCode=0x26, [aicore exception]` -> 507015。
      多个核同时报 (core id 0 与 18, blk 13 与 6)。
    why_it_fits_everything: >
      台账早有一条: `L0AUF_SIZE = L0BUF_SIZE = 65536`, **每个 MatmulImpl 都 InitBuffer
      整块 L0A/L0B, 故 mmq (QK) 与 mmv (PV) 两个对象共用同一片物理 L0B**。
      H21 当初"两侧同开 ping-pong 即 aicore exception"记的就是这个, 但当时的结论是
      "不要两侧同开 ping-pong", **没有把"它们始终共用 L0B"本身当成潜在风险**。
      这条能解释全部现象:
        间歇 —— 取决于两条 matmul 在 L0B 上的时序是否重叠;
        整块粒度 —— 受损的是一个 PV tile 的输出;
        幅度小但真实 —— 读到的是另一条 matmul 的 B 矩阵片段, 不是随机垃圾;
        m32 比 m64 更容易触发 —— 两条 matmul 的时长比不同。
    severity_for_delivery: >
      ★**已交付的 h26b 会在小形状上崩**, 不只是长形状 tile_m=32 的数值抖动。
      141 用例验收通过是因为它没有每次都触发 —— 与重复性闸漏过同一个原因。
      这条必须在任何进一步的性能工作之前处理。
    my_earlier_reference_comparison_was_wrong: >
      ★我用 payload_reference 判"哪一次调用是错的"时下标取错了: 参考是 [B,H,Q,D]
      而内核输出是 [B,Q,H,D]。那组 1.355/1.431/1.389 的"相对参考误差"是我的 bug,
      **不是内核算错的证据**, 已作废。对照行的设计 (取一个无差异的行看它是否也偏离)
      本来就是为抓这个, 我应该在第一次报那组数之前就跑它。
    next_hypothesis: >
      H16 (V 预装进 TSCM/L1) 改变了 mmv 触碰 L1/L0 的时机, 可能正是让共用 L0B 从
      "良性"变成"会撞"的那一步。可证伪: 在 h15 (TSCM 预装之前) 上跑同一个探针,
      若不报 L0B 冲突, 则成因定位到 H16。

