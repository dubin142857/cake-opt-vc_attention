      ★**两边都要量, 不能按计数推** (F236: 遍数/条数是计数, 不是时间)。
      ★本轮**没有**测 MOVEMASK 在真机上占多少 —— 上面的 49% 是**模拟器的时间账**。
        真机份额要另测, 不能直接搬 (E7)。
    an_unresolved_arithmetic_inconsistency: >
      ★★挖这条时撞到一个**对不上的数, 本轮未解决, 先记下来免得被当成已知**:
        仓里的常数 (core.socspec): fp16 cube 峰值 **353.9 TFLOPS**。
        交付形状 2 x 37741 x 37888 x 128 x 28 = 1.025e13 MAC = 2.050e13 FLOP
        -> 全 fp16 的算术下界 **57.9 ms**。
        而 Laser 的真机 msopprof (同形状 [1,28,37741,128]): cube_ratio 0.7186 x
        aic_time 74380 us = cube 忙时 **53.4 ms** —— **低于它自己的 fp16 下界**, 相当于超峰值 108%。
      ★候选解释都没验: `cube_ratio` 的分母是不是 `time(us)` · Task Duration 87299 us 与
