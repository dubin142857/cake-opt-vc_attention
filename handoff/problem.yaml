      AIC 现在有足够的实际工作可供重叠。
      工具亦连续三轮 (h6a/h8/h9) 给同一判读: "两侧最长流水都远小于各自窗口 = 互等,
      该动缓冲深度/流水级数, 不是任何一条流水的带宽"。
    predict: >
      判据 (决策阈值): control_m64 fixed core 相对 h9 的 518.27 ms 下降 >= 10%,
      且 wait_id9 与 wait_id10 之一相对 373079 / 369528 us 显著下降。
      若时间不降而等待也不降, 说明乒乓不是当前约束; 若等待降而时间不降,
      说明瓶颈已转到某条实际 pipe, 按 F50 的占比重新归责。
    status: 已证实并晋升
    confirmed_at: 2026-10-26
    confirmed_by: F52 / F53
    outcome: >
      判据要求 control_m64 fixed core 相对 h9 的 518.27 ms 下降 >= 10% 且 wait 下降。
      实测配对中位 517.42 -> 452.43 ms, 下降 12.49%, 6/6 对为负; 逐位一致;
      8 次重复性检查全部通过。
      ★容量按 host 侧 CubeTiling 的实际参数核算而非估算: 两个 matmul 对象经
      SetBufferSpace(l1/2, l0c/2) 与 shareMode(0) 各占互不重叠的一半 (L1 262144 B / L0C 65536 B),
      dbL0A/B/C 均为 1; QK 的 C 片 65536 B 恰好占满其 L0C 份额, PV 的 32768 B 占一半,
      两者不争用。本改动**不增加任何片上占用**, UB 实测 59904 B 未变。
    capacity_check: >
      GM scratch 每 AIC 由 M*N*6 + M*dim*4 翻倍。N=256/M=64/D=128 时单槽 131072 B,
      双缓冲 262144 B, 24 AIC 合计约 6.3 MB, 对 65536 MB HBM 可忽略。
      L0C 与 UB 不受影响 (双缓冲在 GM)。
    risk: >
      本改动直接改变 Set/Wait 的配对关系, 是 detsync_lint H7 (旗标次数不等=死锁) 的直接对象;
      且 F48 显示对端 v2 的非确定性正属同一类问题 —— 跨核交换未被正确围栏。
      故本候选的重复性检查**必须连跑 8 次以上**比逐位, 不能沿用 2 次。

  - id: H11
    kind: open
    t_declared: 2026-10-26
    hypothesis: >
      让 AIV 在等 O_READY(k) 时先算第 k+1 块的概率, 以压下 id10 (368197 us, 占窗口 81.4%)。
      **该做法此前不可行, 是 H10 使其成为可能** —— AIC 现在预发 QK, 故 S(k+1) 在 AIV 处理第 k 块
      期间就已就绪 (id8 已降到 1.67 us, 即 S 从不缺席)。
      代价是 AIV 侧 raw / score / p 三个缓冲各翻倍。
    predict: >
      判据 (决策阈值): control_m64 fixed core 相对 h10 的 452.43 ms 下降 >= 8%,
      且 aiv_scalar_wait_id10 相对 368197 us 显著下降。
      若 id10 降而时间不降, 说明瓶颈已转到 AIC 的实际 pipe (fixpipe 207427 占 45.9%), 按占比重新归责。
    status: 未实现
    capacity_check: >
      ★初始估算有误, 已按 M64 重算并更正。
      朴素做法 (AIV 同时持有第 k 与第 k+1 块的 raw/score/p) 在 M64 **放不下**:
        VectorBytes(0, 64) = 118784 B; raw+score+p 项为 rows*N*(4+4+2) = 81920 B;
        翻倍后 200704 B > UB 196608 B, 超 4096 B —— 且这是 reduce_bytes=0 的下界。
        M64 是对端 535b6bc 之后的默认派发路径, 故这条不能只按 M32 (59904 -> 100864, 放得下) 判定。
      可行做法是**推迟累加**而非复制缓冲, AIV 的次序改为:
        算 p(k) -> 置 P_READY(k) -> 算 p(k+1) -> 置 P_READY(k+1) -> 等 O_READY(k) -> 累加 O(k)
      此序下第 k 块的 raw/score/p 在第 k+1 块开始前已用完, **可串行复用, 无需翻倍**。
      需要新增的是:
        UB: 为被推迟的第 k 块保留 alpha_k / tile_mass_k / m_k 三个 rows 长 fp32 向量
            (M64: 3*32*4 = 384 B), 若需 Brcb 广播副本再加 3*rows*8*4 = 3072 B;
            合计 < 4 KB, 对 M64 余量 77824 B 不构成压力。
        GM: pg 需第二个槽 —— AIV 写 p(k+1) 时 AIC 的 PV(k) 可能仍在读 pg (见 invariant)。
            tile_m*N*2 = 32768 B (M64); WorkspaceBytes(128,64) 196608 -> 229376 B。
            workspace 由 vc_torch.cpp:138 的 at::empty 在 HBM 上按 cores*bytes 分配
            (20 核约 4.6 MB), 不构成约束。
        L1/L0C 不受影响 (改动不碰 Cube 侧 tile 形状)。
      主机侧已有闸门: vc_torch.cpp:120 的 TORCH_CHECK(VectorBytes(...) <= ub)。
    invariant_to_establish: >
      **pg 单槽假设被打破**, 这是 H11 与 H10 的关键差异。
      当前 pg 由 AIC 的 PV(k) 在 P_READY(k) 之后读取; 若 AIV 在等 O_READY(k) 期间写 p(k+1),
      就与 PV(k) 的读并发。故 pg 必须双槽 (pgs[i & 1]), 且需要一个"AIC 已读完 pg[k&1]"的
      信号才能安全复用该槽 —— O_READY(k) 恰好在 PV(k) 之后置位, 可兼作此证据:
      AIV 要写 p(k+2) 时必须已见 O_READY(k)。两槽轮转下这一条自动满足, 因为
      p(k+2) 的计算排在"等 O_READY(k) -> 累加 O(k)"之后。实现前须逐条复核此论证。
      在线 softmax 的正确性: p(k+1) 需要 m_k, 而 m_k 在算 p(k) 时就已定稿
      (new_m = max(m, scores_k.amax) 不依赖累加), 故推迟累加不影响 p(k+1) 的数值;
      但累加 O(k) 时要用当时记下的 alpha_k, 不能用已被 k+1 更新过的值。
    risk: >
      与 H10 同类 —— 直接改跨核消费时序, 重复性检查必须连跑 8 次以上 (见 F53)。
      另: P 的单槽假设可能被打破 —— AIV 若提前算第 k+1 块的 P, 必须确认 AIC 已消费第 k 块的 pg,
      否则 pg 也需双缓冲。实现前先把这条不变式论证清楚, 不要先写代码。

  - id: H12
    kind: measured_below_criterion
    t_declared: 2026-10-26
    priority: 高于 H11
    hypothesis: >
      QK 的 matmul 改为经 fixpipe 反量化**直出 fp16**, 取代当前的 int32 输出,
      把 S 的回写字节减半。由 F62 重新打开, 由 F63/F64 定位为最大杠杆。
    mechanism: >
      c1Type 由 int32_t 改为 half, 并调用 SetQuantVector 提供按 N 通道的反量化系数。
      scale 的拆分 (方案 A, M32/M64 统一):
        fixpipe 承担 kscale * t.scale —— 沿 N 变化, 每 tile 有 KSB_PER_TILE 个分段, 适配按通道向量;
        AIV 承担 qscale —— 每个 AIV 子块恰好覆盖 ROWS = M/2 = 32 行 = 一个 Q 量化块,
          故是单个标量, 一次全 tile Muls 即可, 比现在的按列分段 Muls 循环更少指令。
      放弃方案 B (把 qscale 也并入 fixpipe): 那需要按 M 分拆 matmul 调用, M64 下调用数翻倍。
    predict: >
      按 F39 的流量算式 (H=28, qpad=kpad=37760, M=64, N=256, D=128):
        S 单向总量 H*qpad*kpad*4 = 159.6 GB -> 79.8 GB
        fixpipe 单向总量 (S+O) 239.4 GB -> 159.6 GB, 即 **-33.3%**
      fixpipe 占 h10 窗口 45.9% (F64), 且 AIC 已是 pipe 受限 (Σpipes 90.9%),
      故窗口预期下降约 45.9% * 33.3% = **-15%**; 另有二阶收益:
        AIV 读 S 的 aiv_mte2 (占 aiv_time 9.8%) 同样减半。
      判据: control_m64 fixed core 相对 h10 的 452.43 ms 下降 >= 10%。
    numerics: >
      **这不是逐位一致的改动** —— S 由精确 int32 变为 fp16 舍入, 必须做精度验收而非逐位比对。
      量级论证: fp16 相对精度 2^-11 约 4.9e-4; 而紧随其后的 ExpCast 用 E4M3 编码概率,
      其尾数仅 3 位 (相对精度 2^-4 约 6.2e-2)。即 fp16 的 S 比它下游已有的量化步骤精确两个数量级,
      预期精度影响远小于现有量化。该论证**需实测确认, 不得当作结论**。
      范围: S_fp16 = raw * kscale * t.scale, 约等于 (q_int . k_real)/sqrt(d);
      现有 _check_inputs 只约束 FP32 上界, 需补一条 fp16 上界检查。
    open_implementation_questions:
      - SetQuantVector 的 uint64_t 系数编码格式 (每元素如何打包 scale), 需在 impl 中确认;
        与 SetQuantScalar 的 GetQuantScalarValue 路径二选一。
      - 当前 MM_CONFIG 是否满足 quant_processor_fixpipe.h:34-37 的
        !IsNeedUB() && !HasScalePosition<A_TYPE>::value, 须编译期确认。
    relation_to_H11: >
      两者独立且方向互补: H12 削减 AIC 的 pipe 工作量, H11 削减跨核等待。
      先做 H12 —— 因为 AIC 当前是 pipe 受限 (90.9%), H11 的收益被这个上限压在 -9.1% 以内;
      H12 降低 AIC pipe 工作量后, 等待才成为相对更大的占比, H11 的上限随之抬高。

