  - id: F226
    t: 2026-10-30
    kind: tooling
    title: "★把 core/sim 做成可信仪器: 加 gap_attrib / gap_profile / --verify / --selftest, 并修掉它自己的两处错数"
    why_this_round_is_tooling: >
      ★观测工具给错数比没有工具更坏 —— 错数会把下一轮判断整个带偏 (本案 F219/F221/F222
        三次返工都有这个成分)。所以这一轮的规矩是: **仪器一出问题就先修仪器**,
        且每条能静默出错的地方都要有一条会**响**的检查。
    added: >
      `gap_attrib(trace, core, pipe)`  把某条流水的每段空隙投影到**所有** (core,pipe) 上,
          报各自的忙时覆盖率与该区间占时最多的指令 —— 答"这条流水在等谁"。
          跨核能对上是因为总览 trace.json 把三个核放在同一条时间轴 (pid=核名, tid=流水名);
          逐核目录下那份只有本核, 做不了跨核 (CLI 对此显式报错)。
      `gap_profile(trace, core, pipe)` 把**全部**空隙按"前后指令对"聚合。与 gap_attrib 分工:
          后者看最大的几段 (追具体现象), 前者看全部的聚合 (定方向) ——
          一段异常大的间隙可能是开工/收工边界, 据它定方向有风险。
      `--verify`  仪器自检四条: 恒等式 (busy+gaps==span 且 idle==gaps) · launch 切分有没有
          丢事件 · **与模拟器自报 duration 的交叉对照** (独立口径, F208 那条纪律) ·
          退化尺子点名。不过就不要拿这份读数下结论。
      `--selftest` 13 条, 在答案可手算的合成 trace 上核对, 含**三条负判据**。
      `run_sim` 改为日志落盘并把模拟器自报的逐核时长存成 `sim_core_duration.json` ——
          那是交叉对照唯一的机器可读来源, 原先只在 stdout 里。
    two_wrong_numbers_it_produced_and_the_fixes: >
      ★(1) gap_attrib 第一版直接累加重叠事件, `cover_pct` 实报 **1588.9%**。
          同一条流水上的事件会彼此重叠 (模拟器给 SCALAR 发多条在飞指令), 必须先合并区间再求交。
          修后保留断言: 覆盖率 >100.5% **直接抛错** —— 这个 >100% 本身就是"合并没生效"的判据,
          宁可报错也不给错数。自检里配了负判据 (两条完全重叠的事件, 忙时必须合并不得累加)。
      ★(2) `--verify` 自己犯了要防的病: 交叉对照整段**跳过**时, 结尾仍无条件打印
          "且与模拟器自报口径一致"。**仪器声称自己没查过的事, 比不查更坏。**
          改成按实际查过的项分别措辞 (全查过 / 只过了恒等式)。
    a_doc_derived_claim_that_measurement_refuted: >
      ★我按文档把"只写 PipeUtilization 会关掉 SET_FLAG/WAIT_FLAG 明细"写成结论, 并据此
        重跑了一轮 20 分钟的模拟。**实测不支持**:
          仅 PipeUtilization   -> ph=X 13785 条, 335 种指令
          PipeUtilization+RCR  -> ph=X 13785 条, 335 种指令, **逐条计数完全相同**
          两者的 WAIT_FLAG_DEVI 都是 cubecore0 3 次 / 每个 veccore 6 次, 一条不多。
        两份 trace 的 md5 不同, 差别只是时序抖动。
      ★已把工具文档串里的说法由"必须, 否则丢数据"降级为"文档如此说, 本机实测无差别",
        并把实测数字写进去。**从文档推出的结论必须标明是推论; 实测对不上就当场改掉。**
    measured_on_vc_attention: >
      卡 3, q=64 k=4096 h=1 (1 任务 8 chunk), core-id=0。**小形状, 占比不可外推 (F206 与
      core/sim 自己的纪律 1); 只用来定位机理。** 自检: 恒等式全成立; 交叉对照
      span 15.922/18.931/19.634 对自报 15.72/18.73/19.43, 差 1.3%/1.1%/1.0%。
      AIV (veccore0) 的 VECTOR: 忙 10.69 us, **空闲 43.5%**, 其中
        micro(发射开销) 316 段仅 0.166 us · **macro(等依赖) 35 段 8.078 us**。
      `gap_profile` 把全部 351 段空隙 (合计 8.244 us) 聚合:
        VADD     -> MOVEMASK   16 次  2.852 us  **34.6%**   <- 每 chunk 两次, 在循环体里
        MOVEMASK -> MOVEMASK    2 次  1.856 us    22.5%     <- 只 2 次, 边界类, 别据它定方向
        BAR      -> BAR        12 次  1.801 us    21.8%
        MOVEMASK -> BAR        34 次  1.342 us    16.3%
      `gap_attrib` 对最大的三段: 两段由 BAR 夹着, 同期 **veccore0 自己的 MTE2 忙满 100%**
        在做 `MOV_OUT_TO_UB`; 最大那段 (1.497us) 是本核 SCALAR 忙 99.9% 做 `STI_XN_IMM`。
      ★跨核旗标在本形状上**不是**向量空闲的主因: WAIT_FLAG_DEVI 每个 veccore 只 6 次。
    next: >
