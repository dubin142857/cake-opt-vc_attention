    two_prior_experiments_already_said_so: >
      ★**我差点按一个已被证伪的前提去设计**。台账里早有两条:
        H17 (F114): 把 S_READY 的等待**完全消除**, 窗口反而 **+1.43%**。
        H18 (F114): 把关键环的软件流水由 2 轮加深到 3 轮 (正是 KFC 深度 4 的同类动作),
                   **所有等待纹丝不动** —— O_READY 不降反升 302.9 us, 全部增量在 2000 us
                   以内而窗口是 280000 us。
      两条都是"跨核深度/阻塞不是窗口的成因"的直接证据。F114 当时据此关闭了该方向,
      而我在 F141 里又按"深度 1 对深度 4"重新论证了一遍同一个前提。
    corrects_F139: >
      F139 把"窗口 - 最大工作通路 = 0.86~0.90 us/tile"归因为**跨核串行**, 并据此给出
      "KFC 式重写上界 -31%"。归因**不成立**: 同一组数同样符合"AIV 自身四条通路不重叠"
      (实测 AIV 内部重叠仅 1.18), 而 H17/H18 的两次证伪只与后者相容。
      F139 的**数字** (上界 207.3 / 192.6 ms) 不变 —— 它就是 max(各工作通路);
      变的是**成因与手段**: 要摸到那个上界得让 AIV 的 mte2/mte3/标量藏到 vec 之下,
