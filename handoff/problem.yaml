  - id: F141
    t: 2026-10-28
    severity: fact
    claim: >
      **KFC 方向的三条前置事实已查实 (全部来自装机的 CANN 9.0.0 与一次真实编译):
      本机 `__NPU_ARCH__ == 2201`; 通用 cube-group 服务在本 arch **只声明不实现**;
      但 matmul 专用的 KFC (MatmulClient / MatmulServiceAux) 由编译期宏选中, 这条路是通的。**
    arch_is_2201: >
      用 `#error` 分支穷举插进 vc_kernel.cpp 跑一次真实构建 (SOC_VERSION=Ascend910B2,
      与正式构建同参数), 编译器报出 `KFC_PROBE__ARCH_IS_2201_CUBEGROUP_AVAILABLE`。
      ★不是从文档或 SoC 名推的, 是编译器自己说的。探针已清, 分支已删。
    generic_cube_group_is_declared_but_not_implemented_here: >
      `basic_api/core_mng/roc/kernel_operator_cube_group_intf.h` 按
      `#if __NPU_ARCH__ == 2201 || __NPU_ARCH__ == 3510` 放行, 声明了
      `CubeResGroupHandle` / `CreateCubeResGroup`。
      但成员实现在 `impl/basic_api/**dav_c310**/core_mng/roc/kernel_operator_cube_group_handle_impl.h`
      里有 22 处, 在 **dav_c220 的同名文件里一处都没有** (它只定义 KfcWorkspace)。
      ★**接口的 arch 门与实现的 arch 门不一致** —— 与 F119 记的 `WaitIterateAll()`
      只在 `__NPU_ARCH__ == 5102` 下编译是同一个形态, 本仓第二次撞。
      故"直接用官方通用 cube-group 原语"这条路在本机**不通**, 不要按它设计。
    the_path_that_is_open: >
      `adv_api/matmul/matmul_intf.h` 的分派 (非 CPU-debug 的真实路径):
        SPLIT_CORE_CUBE + ASCENDC_CUBE_ONLY -> MatmulImpl
        SPLIT_CORE_CUBE                     -> **MatmulServiceAux**  (AIC 服务端)
        SPLIT_CORE_VEC                      -> **MatmulClient**      (AIV 客户端)
        ASCENDC_MATMUL_AICORE 且非 CUBE_ONLY -> MatmulClient
        其余                                -> MatmulImpl  ← **我们现在在这条**
      即 KFC 由**编译期宏**选中, 内核按 split-core 编两遍 (cube 一遍、vector 一遍)。
      `matmul_client_impl_aicore.h` 不分 arch; `matmul_client.h` 里 2201 被显式处理。
    shared_design_constants: >
      两个 arch 的 cube_group_info 头**除 pragma 里的路径字符串外完全相同**, 故这些是共有设计:
        MAX_MSG_PER_AIV = 4      —— 单个 AIV->AIC 对最多 4 条消息在途 (流水深度)
        CubeMsgState             —— FREE / VALID / QUIT / FAKE, 1 字节 volatile
        CACHE_LINE_LEN = 512     —— 消息按 cacheline 对齐, 因为经 **dcci** 发布
        PipeMode = SCALAR | MTE3 —— 消息写入可走标量或 MTE3
      ★消息**住在 GM**, 不是硬件邮箱; 跨核可见性靠 dcci 的 cache 清/失效, 不靠标志寄存器。
      在 c220 上这些常量服务于 group barrier; matmul KFC 自己的消息结构是 matmul_client.h 的 KfcMsg。
    why_this_matters_for_the_0_87_slack: >
      我们的手写协议与 KFC 在硬件层面的差别, 落到 F139 那 0.86~0.90 us/tile 的空隙上:
        在途深度  手写 1 (置位后对侧必须先消费) 对 KFC 4
        等待方式  CrossCoreWaitFlag **阻塞** 对 KFC 的 `Wait<false>` **可非阻塞轮询**
      实测 AIC 每 tile 空等 P_READY 1.6269 us —— 深度 1 与阻塞等待是它的直接成因。
    next_increment: >
      下一步**不是**改算子, 是先验 split-core 构建在本仓能不能跑通:
      用 SPLIT_CORE_VEC / SPLIT_CORE_CUBE 编一个最小的两段式内核, 确认
      (a) 两个编译单元都能产出, (b) MatmulClient 与 MatmulServiceAux 都实例化得出来,
      (c) 现有的 setup.py / CMake 能不能表达这种双编译。
      ★先验能不能编, 再谈怎么设计 —— 本轮已经因为"接口有而实现无"差点按错误前提设计。

  - id: F142
