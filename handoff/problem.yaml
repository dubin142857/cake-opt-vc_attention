  - id: F163
    t: 2026-10-28
    kind: environment
    status: worked_around
    title: "Laser 本地源码构建: ld.lld unknown emulation aicorelinux —— 归因未完成"
    symptom: >
      `build_mindie_laser_local.py --jobs 16` 在 CompileStage.FATBIN 报
      `ld.lld: error: unknown emulation: aicorelinux`, 两个 kernel 目标 (_0/_1) 都中。
    ruled_out:
      - "链接器本身: CANN 的 bin/ld.lld 与 tools/ccec_compiler/bin/ld.lld **是同一个二进制**
         (都软链到 tools/bisheng_compiler/bin/lld), 实测接受 -m aicorelinux。
         只有 /usr/bin/ld.lld (Ubuntu LLD 14.0.0) 不认, 而它在 PATH 上排在 CANN 之后。"
      - "构建环境: 用 build_mindie_laser_local.build_environment 算出的那份环境,
         shutil.which('ld.lld') 解析到的就是好的那个; PATH 前两项都是 CANN。"
      - "opc 包装脚本: 通读全文, 不碰 PATH, 只设 PYTHONPATH。"
      - "把失败的 _0 目标用**构建自己算出的那份环境**手动跑, RC=0。_1 同样。"
    mechanism_hypothesis: >
      TBE 的 CCECInfo._get_exe_path 用 `which ld.lld` 定位: 成功则返回**裸名**,
      失败则回落到一个写死的路径。并行压力下该子进程若非零返回就会走回落分支。
      ★这只是假设 —— 见下面"归因未完成"。
    workaround: "--jobs 1 串行构建, BUILD_RC=0, 产物与 manifest 齐全。"
    attribution_incomplete: >
      ★**不能把成功归因于串行**: 串行那次之前, 我已手动编出两个 kernel 对象
      (cec6c38a / 713c55d8), 串行构建很可能直接复用了它们 —— 而且串行日志里
      **仍有 5 处 unknown emulation**。要确认必须做一次**全新清理构建**:
      删掉 build/mindie_laser_source 与 build/mindie_laser_install 后
      只跑 --jobs 1, 看是否仍过。未做, 记为待办。
    my_own_weak_check: >
      ★第一次测"哪个链接器认 aicorelinux"用的是 `ld.lld -m aicorelinux --version`,
      五个候选**全报认** —— --version 在解析 -m 之前就短路返回。
      改成真正触发链接 (`-m aicorelinux e.o -o out`) 才分出来。
      本会话第二次写出假通过的检查, 与 opdbg --mutation 要防的是同一类。

