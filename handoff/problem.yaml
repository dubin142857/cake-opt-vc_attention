        `--cap mmad` -> c_api 里 10 个 asc_mmad* (秒级)
        `--where load_cbuf_to_ca` -> "任何一层都没有声明…先确认公开层没有再逆向"
      **本可省掉那三次构建。**
    selftest: "9 条, 含两条负例 (不存在的符号返回空 · ccec 内建在任何层都没有声明) 与四条正例 (asc_mmad 找得到且判为公开 · 能力检索命中且含 _sync)。0 条未过。"
    phase0_progress: "mm128 改用公开 C API 后**一次构建即过**; 产物指纹 51d5680c -> 427aaab8, CubeV2 探针符号在产物里 (核过不是缓存假过)。"

  - id: F184
    t: 2026-10-29
    kind: tool
    title: "★沉淀入库却检索不到: whatfor 只按空白拆词, 而本仓语料全是中文 —— 中文自然提问几乎必然零命中"
    what_happened: >
      F183 把经验沉淀成 core/cannapi 并提交, 预提交闸以 `opdbg.areas rc=1` 拦下
      (新模块没进 core/_areas.json 的功能区表)。补登记后闸绿, 但**检索仍然落空**:
      用这个工具要解决的问题原话去问 —— `whatfor 公开接口` 零命中,
      `whatfor 编译器内建没有声明` 零命中。入了库, 下次的人还是找不到它。
      两层原因, 第二层才是普遍的:
        (1) core/_desc.json 里没有 cannapi 的描述 (68 个键 vs 69 个模块)。
            ★而"描述完整性"自检只守已有键的**截断与缩水**, 不守键的**缺失** —— 它一直是绿的。
        (2) ★whatfor 的拆词是 `t.split()`, **只按空白**。本仓 _desc.json 与模块文档全是中文,
            中文自然提问没有空白, 于是拆词**从不触发**, 整句走子串包含, 必然零命中。
            实证: `whatfor 公开接口声明` 零命中, 而 `whatfor "公开接口 声明"` 命中 12 个
            —— 同一个意图, 只差一个空格。
    why_it_matters: >
      与 2026-10-27 那次同形而更广。零命中的提示语写着"确认真的没有, 再考虑新写",
      于是**专为防重复造轮子而建的入口, 对中文提问几乎总是把人推向重写一个**。
      2026-10-27 已经修过一次"整句当一个词必然零命中", 但修法只覆盖了空格分隔的短语,
      没覆盖本仓的主要语言。★修一个 bug 时, 要问它在本仓的主要语料上是否真的成立。
    fix: >
      (a) cannapi 入 _areas.json 的 nav 区 (与 dslapi 同类: 都是 API 面索引, 一个对
          CANNBot-DSL, 一个对 CANN 自身), 并补 _desc.json 描述。
      (b) whatfor 加**中文连续子串回退**: 只在零命中时接手, 从整句枚举连续子串,
          保留真的命中模块的、丢掉被更长命中片段包住的、丢掉过于笼统的。
          ★"只在零命中时触发"是构造性约束 —— 它使回退不可能改变任何原本有命中的查询。
    params_are_measured_not_guessed: >
      两个参数在正负两个语料上扫出来 (69 个模块语料; 正例 8 条中文技术提问 / 负例 7 条无关中文):
        最短片段 3 字: 取 2 则负例 5/7 被造出命中 ("今天" "去了" "我要" "很可");
                       取 4 则正例掉到 5/8 ("访存不对齐" "扫一遍档位" 全灭)。
        虚词不作首字 (的了着吗呢吧): 长度 3 时残留唯一误报是"的做法"; 加这条后负例 0/7。
      ★命中**数**分不开真伪 —— 实测"公开接口"命中 1 个模块, 而误报的"的做法"命中 2 个,
        所以靠收紧命中上限筛不掉误报。这是量出来的, 不是想出来的。
      修前/修后: 正例 0/8 -> 8/8 有命中; 负例 0/7 -> 0/7 凭空命中 (两头都站得住)。
    selftest: >
      _nc_whatfor_cjk, 注册进 --selftest-areas, 盯三件事: 正例 (本轮实撞原话必须命中) ·
      负例一 (原本有命中的查询, 回退不得触发) · 负例二 (6 条无关中文不得被造出命中)。
      三条变异各自验过会红: _CJK_MIN 3->2 -> 报 4 条无关中文被造出命中;
      去掉虚词过滤 -> 报"红烧肉的做法"; 整个回退关掉 -> 报两条正例失守。还原后绿。
    side_finding: >
      回退如实返回语料里真有的东西, 由此暴露出**描述缺词**: "访存不对齐"检索不到 alignlint
      (它的描述写的是"对齐违规", 没有"不对齐"); "内核挂死"检索不到 hangdiag;
      "扫一遍档位"检索不到 stagebisect。这是三条描述的问题, 不是回退的问题, 本轮未修。
    lesson: >
      ★登记进表(闸绿) ≠ 检索得到(可用)。沉淀的验收标准是"下次的人用他自己的话能问出来",
      不是"文件进了仓"。验收要用**问题原话**去问, 不是用工具自己的命名去问。

  - id: F185
    t: 2026-10-29
    kind: plan
    title: "★重写计划的 Phase 0 与 Phase 4 建立在一个假前提上: 以为基线是 FP16, 而 Q/K 在算子入口就是 int8"
    what_happened: >
      REWRITE_PLAN.md 写 "Phase 0 — FP16 契约先不量化" 与 "Phase 4 — 叠 INT8 QK"。
      动手前读 ascend/csrc/vc_torch.cpp 才发现:
        CheckTensor(q, q, at::kChar, "Q"); CheckTensor(k, q, at::kChar, "K");
      ★Q 与 K 在算子入口**就是 int8**, 连同分块 scale (qs/ks) 与 128 项 FP32 LUT 一起传入;
      V 是 half + 逐通道 scale (vs), 输出 float32, D 只能是 64 或 128。
      即 **INT8 QK 是算子的接口契约, 不是我们的内部优化选择**。
      Phase 0 的"保持 FP16 不量化"做不到 —— 没有 FP16 的 Q/K 可用;
      Phase 4 的"叠 INT8 QK"已经是现状, 剩下的只有 PV (而 V 入口是 half, 自行量化要占
      已经吃紧的向量单元去省只占窗口 18.1% 的 cube, 几乎必为负收益)。
    second_error_same_place: >
      ★同一段验收还写错了**比的是哪个参考**: 原文"对 dense FP32 参考的相对 RMSE 在 1% 闸内"。
      仓库真正的闸在 scripts/validate_ascend910b.py:173, 比的是**解码参考**
      (payload_reference, 用同一批 int8 解码输入算): "Decoded-reference implementation
      RMSE exceeds 1%"。dense_fp32 只记录**不设闸**。
      实测 results/ascend910b_validation.json (141 例, status=passed):
        decoded_reference RMSE 最大 **0.00007** —— 闸是 0.01, 余量 143 倍;
        dense_fp32 RMSE 最大 0.0463 / 中位 0.0286 —— 这就是对甲方报的 2.98%。
      ★结论随之改变: 我们的实现对解码参考几乎精确, **2.98% 全部来自输入量化契约,
        不是实现误差**。此前"精度的 16 倍差距来自量化契约本身"这句话方向对, 但
        Laser 同样做 INT8 QK 却只有 0.191% —— 差距在**量化方案**(scale 粒度), 两边都不是实现误差。
      另: 文档与 loop 提示里的"24 个用例"也不对, 实际 141 例 (PERF_COMPARISON.md:132 的
      24 是 tile_m=32 缺陷修复那次的子集)。
    contract_facts_now_pinned: >
      Q: int8 [B,H,Qpad,D] + qs [B,H,Qpad/32,8]  (★8 个里只用第 0 个, 其余是 32B 对齐填充)
      K: int8 [B,H,Kpad,D] + ks [B,H,Kpad/128,8] (同上, K_SCALE_BLOCK=128)
      V: half [B,H,Kpad,D] + vs [B,H,D];  LUT: 128 项 fp32;  输出: float32;  D ∈ {64,128}
      host 侧 tile_m 只接受 32 或 64 (vc_torch.cpp:101), Q 量化块固定 32 行。
      ★反量化因此是**每 (32 查询行 × 128 键) 子块一个标量**:
        seg_scale = qscale[0] * kscale[sb*8] * t.scale  (vc_kernel.cpp 向量段)
    replanning: >
      ★把"手写 cube + 128×128"降级为**不是通往 binding pipe 的最短路径**。
      理由基于已测数据而非类比: binding pipe 是 aic_fixpipe (192589 µs / 窗口 280251),
      而 fixpipe 搬的是 L0C->GM 的字节。按契约算字节比例: S 每 (查询行,键) 对 4 字节,
      O 每对 4*D/N = 2 字节, 故 S 占 fixpipe 字节的 2/3。
      **S 工作区由 int32 改 half 是直接作用在 binding pipe 上的最小改动**, 且
      CANN 的 MatmulImpl 自带 SetQuantScalar(uint64_t) / SetQuantVector(GlobalTensor<uint64_t>)
      (asc/impl/adv_api/detail/matmul/matmul_impl_base.h:110-112) ——
      K 的 scale 沿**列**变化, 正是 quant vector 能表达的方向; Q 的 scale 沿**行**变化,
      留给向量侧一次 Muls (比现在 KSB_PER_TILE × K_SCALE_BLOCK/64 次分段 Muls 还少)。
      **这条路不需要手写 cube**。连带收益: 向量侧少一次 ROWS×N 的 Cast(int32->fp32),
      MTE2 读 S 的字节减半。
      已写的 vc_l1l0_map.h 与 vc_cube_v2.h 不作废 —— T8 软件流水与 T1 对角阵矩乘
      是 MatmulImpl 表达不了的, 那时仍要手写。只是**次序**换了。
    prediction_frozen_per_E9: >
      ★在测之前冻结 (E9): 若 fixpipe 时间与搬运字节成正比, S 由 4 字节改 2 字节
      使 fixpipe 字节由 6 单位降到 4 单位 (×0.667), 即 192589 -> 约 128400 µs,
      **fixpipe 仍是 binding pipe** (cube 50767), 窗口 280251 -> 约 216000 µs。
      ★但 Probe 1b 已部分否证按字节的比例关系 (M 加倍时 fixpipe 只 ×1.487 而非 ×2),
      故上面是**上界量级估计不是预测值**; 实测若落在 ×0.667 与 ×1.0 之间都不构成意外,
