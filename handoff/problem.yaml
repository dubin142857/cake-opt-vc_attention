      AIV 自身工作的占比由 **87.2% 升到 99.0%** (+11%) —— 正好吃掉它原有的约 10-13% 余量
      并翻转成关键路径; 端到端的 +12.3% 与这 +11% 吻合。
      成因是两条**新增的整块 Cast**: 趟 1 多一条 fp32->fp16 的存, 趟 2 多一条 fp16->fp32 的读。
