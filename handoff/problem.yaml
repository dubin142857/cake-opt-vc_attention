      让**编译器**拦住越界与重叠。L1 切 8 个 64KB 槽, 前四个给 A/B 双缓冲,
      后四个**预留**给 Phase 3 的对角阵与累加器驻留 (现在就定地址, 免得那时搬动前四个)。
    why_this_first: >
      Phase 0 的最大风险我标过: 手写地址失去 TPipe 的边界守护, 而我们的竞态正是
      两个 MatmulImpl 共用物理 L0A/L0B 且**源码里看不出来**造成的;
      TPipe 的越界断言还只在 ASCENDC_CPU_DEBUG 下存在, 真机不设防。
      本文件把守护补回来, 而且是**编译期**的 —— 比运行时断言更早、更硬。
    mutation_proof:
