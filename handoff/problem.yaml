  - id: F233
    t: 2026-10-30
    kind: result
    title: "★★fixpipe 逐通道反量化 (VDEQF16) 的形参已数值坐实; 并测出 C-API 的 `asc_set_l0c2gm_config` **不能**用于向量量化模式"
    what_was_confirmed: >
      探针 `scripts/probe_fixpipe_vdeq.py` + 内核 `vc910_fixpipe_vdeq_probe`,
      卡 3 与卡 4 **各跑一次, 逐位相同**。三条判据:
        C1 编码: 逐通道项 = **fp32 scale 的位模式零扩展成 uint64**。成立
           (2 的幂那组 8192 个元素逐位相同 —— 那一组乘积在 fp16 内精确, 舍入是恒等,
            所以它只检验编码)。
        C2 施加方向: **沿 N 方向逐通道**。成立。scale 逐列不同且第 0 列与第 1 列差一个量级,
           标量模型**不**匹配 —— 若所有列同 scale, 这两种解释给出同一答案, 样例就钉不住契约 (E6)。
        C3 数值语义: **`float16( float32(int32) * trunc13(scale) )`**, fp16 转换就近偶数。
           在 8 个候选模型里**唯一**逐位相同 (0/8192 不符); 次优的 `trunc12` 有 1992 个不符,
           直接用全精度 fp32 scale 的 3956 个不符。
    the_two_docs_are_now_reconciled: >
      ★此前两处本机文档对编码**互相矛盾**, 正是立这个探针的理由:
        `tbe/tik/debug/intrinsic_cube.py:121`  "bits[0:31] is deq value of fp32"
        `asc/impl/basic_api/dav_c220/kernel_operator_fixpipe_v2_impl.h`  "bits[31:13] is deq value of fp32"
      实测把两句话接上了: **你按 bits[0:31] 放一个完整 fp32, 而硬件只用 bits[31:13]** ——
      低 13 位尾数被**截断**(不是进位)。剩下 10 位尾数恰好是 fp16 的尾数宽度。
      ★这条若不测, 会以"scale 精度悄悄少 13 位"的形式进入数值, 而且只在非 2 的幂的 scale 上显形。
    the_bug_the_probe_caught: >
      ★第一次构建直接 **507015 aicore 异常** (`mte error info: 0x90100109a`), 原因是:
        C-API 的 `asc_capi_fpc_reg_config` 把 FPC[15:8] 叫 **`quant_units`** (量化模式号),
        而硬件/AscendC 把 FPC[15:8] 当作 **deq 向量在 FB 里的地址**, 单位 128 字节
        (`CopyDeqTensorToFbuf`: `deqTensorAddr = ((uint64_t)fb >> 7) << 8`)。
      于是 `asc_set_l0c2gm_config(0, VDEQF16, false)` 把模式号 **10** 写进 FPC[15:8],
        硬件读成"deq 向量在 FB 偏移 10*128 = 1280" —— 越出已拷贝区, MTE 异常。
      ★**生产路径一直没暴露**, 因为它传的是 `NoQuant` = 0, 写 0 恰好无害。
      ★正确做法: 量化**模式**由指令的 QuantPRE 形参带 (AscendC 的 `FixpipeL0cToOut` 也是这么做的),
        FPC 只负责那个地址; 且 `set_fpc` 必须排在**发射前一刻** ——
        因为 `asc_set_l0c2gm_config` 内部 `config = 0` 会把整个 FPC 清掉。
      ★这正是 F183 立的次序在起作用: 猜错在**一次构建 + 一次运行**里暴露, 而不是污染内核后去 141 例里排查。
    the_hard_constraint_this_round_established: >
      ★★**本机 (`__NPU_ARCH__` 2201) 对 int32 源没有任何带 quant 的 fp32 出口。** 两条独立来源:
        (1) `CheckFixpipeL0C2GMParam` 的 SupportType: src int32_t -> dst 只有
            int8_t / uint8_t / **half** / int32_t; src float -> float 时 quantPre 必须 NoQuant;
        (2) `QuantMode_t` 里 `VQF322F32_PRE` 只在 3510/9201/5102/310R6 上存在, 2201 没有;
            `VQS322BF16_PRE` (int32->bf16) 同样只在 3510 上。
      ★向量侧同理: `asc_deq_int322half` 是唯一的 int32 反量化, 输出也只有 half。
      **所以"把反量化挪到 fixpipe"必然伴随 S 转 fp16, 这是硬件强加的, 不是设计选择。**
    what_this_means_for_the_candidate: >
      ★把三件事接起来:
        · 性能: F231 实测上界 **−3.02%** —— 它量的正是 **2 遍 -> 1 遍**
          (fixpipe 吐 fp16, AIV 仍要一遍 `Cast(fp16->fp32)`), 与这里的硬约束**正好吻合**。
          F231 当时写的"真实上界严格大于它 (2 遍->0 遍)" **不成立** —— 0 遍那条路硬件上不存在。
          ★这是 E21 那条"消融的是哪一块决定了它是谁的上界"的又一个实例,
            而这次纠正它的不是消融, 是**接口约束**。
        · 数值: 代价已由 F220 离线量过 —— control 的 dense RMSE +0.000374 pp (可忽略),
          对 oracle 逐行最坏 0.093% (1% 闸内); 但 **expcast 逐行最坏 1.816%, 打穿 1% 闸**,
          除非 oracle 同步改契约 (传 score_dtype)。**那是契约变更, 必须留痕。**
        · 另加一笔本轮新查出的精度损失: scale 的低 13 位尾数被截断。K-scale 是 fp32,
          截断后只剩 10 位尾数 —— 这一项 F220 的离线模型**没有算进去**, 要重算。
      ★结论: 候选仍然成立但**代价清单变长了**, 不再是"−3.02% 换一点 fp16 误差":
        还要加上 scale 精度降级, 以及 expcast 一侧的 oracle 契约变更。
