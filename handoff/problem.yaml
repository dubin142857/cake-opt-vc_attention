        --where <符号>  它在哪一层声明、公开还是内部; 查不到时**给出下一步命令**
        --cap <能力词>  按能力找公开候选, 并提示 _sync 变体
      层的位置一律**探测**不写死 (版本目录名会变, 与 socspec.tool_path 同口径)。
    decisive_validation: >
