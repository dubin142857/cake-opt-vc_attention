  - id: F238
    t: 2026-10-31
    kind: design
    title: "★组合拳的形态定下来了: fixpipe **一次**调用只施加 ks·scale, qs 由 AIV 的 `Axpy<float,half>` 吸收"
    the_constraint_recomputed: >
      ★把约束重算一遍, 发现此前的形态把问题想复杂了:
        S[i][j] = (q_i · k_j) · qs_i · ks_j · scale
        · `ks_j` 沿 **N** 变化, 而**一个 cube tile 正好一个 K 量化块**
          (NBLK == K_SCALE_BLOCK == 128) -> **ks 对整块是一个标量**, 连逐通道向量都用不上;
        · `qs_i` 沿 **M** 变化 (Q_SCALE_BLOCK=32, tile M=64), 这才是 fixpipe 施加不了的那一项;
        · **但在 AIV 侧, 每个半核恰好管 32 行 = 一个 Q 量化块** ->
          **qs 对半核也只是一个标量** (`qscale.GetValue(0)` 本来就依赖这一条)。
      ★所以不必让 fixpipe 去处理 M 方向的差异 —— 让它只做**整块一个标量**的 ks·scale,
        qs 留给 AIV 的一个标量乘。问题就从"怎么发一次 fixpipe"变成"那一个标量乘怎么不另占一遍"。
    the_interface_fact_that_unlocks_it: >
      ★查实 (本机头文件, `impl/basic_api/dav_c220/kernel_operator_vec_ternary_scalar_impl.h:30`):
        `Axpy` 在 dav_c220 上支持的 (dst, src) 组合是
        **`Tuple<half,half>` · `Tuple<float,float>` · `Tuple<float,half>`**。
        语义 `dst[i] = src[i] * scalar + dst[i]`, 标量类型跟 **src** (即 fp16)。
      ★即 `Axpy<float, half>` 把**半精度读取 + 乘标量 + 累加到 fp32** 融进**一条**指令。
      ★另查实: `COLUMN_MAJOR` 出口在 dav_c220 的实现里**一处都没有** (只在 dav_c310) ——
        所以 F237 的候选 (甲)「把查询方向换成 cube 的 N」没有"写出时转置"可用, 暂不考虑。
    the_form: >
      ★三件事一起做 (E37: 单刀可能都不正, 组合才正):
        (1) **fixpipe 一次调用** MSize=64, 标量 deq = `ks_block * t.scale`
            (整块一个值; 按 F235 的 C4, 标量 DEQF16 的编码已坐实, 低 13 位尾数被截断);
            -> F237 实测这一形态下 `aic_fixpipe` **63805 us, 低于基线**, 没有 M 拆分的罚。
        (2) **chunkScore 保持 fp16** (不再在趟 1 转 fp32):
            趟 1 只剩 DataCopy + 尾部掩码 + ReduceMax ——
            **Cast 与反量化 Muls 两遍整块操作一起消失**;
            顺带 scoreBuf 由 65536 B 减半到 32768 B (tile_m=128 那一轮用得上)。
        (3) **趟 2 用 `Axpy<float,half>`** 把"转 fp32 + 乘 qs + 减行最大值"合成一条:
            先把 fp32 目标按行填成 `-qs*m`, 再 `Axpy(dst, score_fp16, qs_half)`
            得到 `qs*(s - m)`, 随后照常 `Exp`。
      ★行最大值仍然正确: `max_j(qs*s_j) = qs * max_j(s_j)` (qs > 0), 故趟 1 在**未乘 qs**的
        fp16 分数上求最大值, 再对 32 个元素乘一次 qs 即可 —— 那是 32 个元素, 不是一遍。
    the_pass_count_on_paper: >
      ★按**遍数**算 (每遍 = 一次 ROWS x N 的整块操作), 这是 E19 第 (1)(2) 问的输入:
        现行   趟1: Cast + Muls + ReduceMax  趟2: Sub + Exp            = 5 遍
        新形态 趟1: ReduceMax                趟2: 逐行填 + Axpy + Exp  = 4 遍
        净 **−1 遍**, 且 AIV 的 mte2 读字节减半, fixpipe 写字节减半。
      ★**但这是纸面账, 不是预测** —— 特别是"逐行填"那一遍的真实代价没量过
        (今天的 `Sub` 靠 Brcb 的跨步广播省掉了它)。F236 的教训就在这里:
