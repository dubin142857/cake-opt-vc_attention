      - "变异 A: 让 L1_B_PING 与 A_PONG 重叠 -> **1 条 static_assert 触发** (重叠检查有效)"
      - "变异 B: 块改成 96x96 -> **6 条 static_assert 触发** (几何贴合检查有效)"
    not_yet: "本文件尚未被内核引用 —— 它是地基。下一个增量是把 cube 侧接上去。"

  - id: F183
    t: 2026-10-29
    kind: tool
    title: "★走了三次构建的弯路: 逆向未声明内建, 而有声明的公开 C API 一直在; 沉淀为 core/cannapi"
    what_happened: >
      给 VC-Attention 手写 cube 时, 我照着 MindIE Laser 逆向一组 ccec 编译器内建
      (mad / load_cbuf_to_ca / load_cbuf_to_cb / set_flag / copy_matrix_cc_to_gm)。
      它们在**任何头文件里都没有声明**, 只能靠编译器报错一个参数一个参数地试:
        第 1 次构建: load_cbuf_to_cb 的转置参数必须是编译期常量 (运行时 bool 报
          "does not support the given target feature")。
        第 2 次: set_flag 第三参传 uint8_t 报 "must be a type 'event_t'"。
        第 3 次: 改成 constexpr AscendC::event_t 与 int, **仍报同一个错**。
      第 3 次之后才去找 CANN 自家的调用点, 发现
      `<cann>/aarch64-linux/asc/include/c_api/` 下有一整套**有声明、按 dtype 重载、
      受支持**的公开接口 (asc_mmad / asc_copy_gm2l1_nd2nz / asc_copy_l12l0a / asc_sync_*)。
      改用它之后**一次构建即过**。
    root_cause: >
      ★我此前**搜过**公开头, 但搜的是 `ascendc/include` —— 而它在 `asc/include`。
      搜索根错了 (教训二第 N 次)。更本质的是**次序错了**: 逆向未文档化接口之前,
      应先把"本机有哪几层接口、哪层声明了它"问清楚。
    bonus_finding: >
      公开 API 每个函数都有 **_sync 变体** (asc_mmad_sync / asc_copy_*_sync),
      内嵌必要的流水同步。这正好契合相位计划: Phase 0 的目标是"骨架做对不求快",
      用 _sync 可**构造性地避开手写 set/wait 的一整类错误** —— 而我们那个竞态正是
      同步问题; Phase 2 做软件流水时再换手动同步换重叠。
    boundary: >
      公开 API 覆盖**不完整**: L0C -> GM 只有配置函数 (asc_set_l0c2gm_config /
      asc_set_l0c2gm_nz2nd), **没有搬运函数**, 那一步仍需内建 copy_matrix_cc_to_gm。
      即预期形态是"配置走公开 API, 发射走内建"。四步里三步有类型检查。
    the_tool: >
      core/cannapi.py —— CANN **自身** API 面的索引器 (与 dslapi 的分工: 那个索引
