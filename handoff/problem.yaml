  - id: F182
    t: 2026-10-29
    kind: progress
    title: "Phase 0 起步: 片上地址表写成编译期可验的常量, 变异证明断言不是摆设"
    branch: r1-laser-dataflow (从 0b03cc5 切出; 回退点 tag delivery-h26-bitdecode)
    scoping_correction: >
      ★动手前勘察现有内核, 发现跨度比预想**小得多**: 我们**已经有**角色分派
      (RunAttention 按 ASCEND_IS_AIC / ASCEND_IS_AIV 分到 Cube::RunCube 与
      Vector::RunVector), 即 T2 其实已具备, 只是用运行时分支而非 Laser 的编译期 #ifdef。
      所以 Phase 0 不是"重写 4800 行", 而是**换掉 cube 侧的 MatmulImpl 与缓存布局**:
      T3 (128x128) + T4 (手写地址) + T6 (half workspace), 保持 FP16 契约。
    capacities_from_our_own_ini: >
      ★容量取自本机 Ascend910B2.ini 的 [AICoreSpec], **不照抄 Laser**:
        l0_a_size 65536 · l0_b_size 65536 · l0_c_size 131072 · l1_size 524288 ·
        cube_m/n/k_size 16
      据此验证 128x128 在**我们自己的机器上**同样精确贴合:
        128*128*2 (fp16) = 32768 = L0A/L0B 的 ping-pong 半区
        128*128*4 (fp32) = 65536 = L0C 的 ping-pong 半区
        L1 524288 = 8 x 65536
