  - id: F207
    t: 2026-10-30
    kind: note
    title: "★CANN 官方的区间剖析接口在本机可用: `AscendC::MetricsProfStart/Stop` 能把硬件计数器门控到一段代码"
    source: "用户给的文档页 https://asc.gitcode.com/guide/programming_guide/library_api/utils_api.html 的调优接口一节; 随后在本机 CANN 9.0.0 头文件中逐条核实。"
    available_on_2201: >
      - **`AscendC::MetricsProfStart()` / `MetricsProfStop()`** —— 公开接口在
        `include/basic_api/kernel_prof_trace_intf.h`, 由 `kernel_vec_intf.h` / `kernel_cube_intf.h`
        拉进 `kernel_operator.h`, 故**本仓内核已可直接调用, 无需新增 include**。
        实现 (`__clang_cce_aicore_functions.h:5235`, 对 `__DAV_C220_VEC__`/`__DAV_C220_CUBE__`):
          `pipe_barrier(PIPE_ALL); set_ctrl(sbitset1(get_ctrl(), 0)); pipe_barrier(PIPE_ALL);`
        即**用 CTRL 第 0 位开关硬件性能计数器**, 可把 msprof 的采集限定到一段代码区间。
      - `asc_time_stamp(uint32_t desc_id)` —— 往 GM 环形缓冲写 TLV (blockIdx · cycle · PC · entry),
