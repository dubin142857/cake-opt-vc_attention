  - id: F143
    t: 2026-10-28
    severity: fact
    claim: >
      **FA 的 aiv_vec 只有我们 44% 的原因查清了, 而且与 KFC 无关:
      我们用 int8 量化做 QK, 把反量化的代价挪到了 AIV 的向量通路上 ——
      而我们恰恰是向量受限的。这个交易做反了方向。**
    how_established: >
      本机没有 CANN 算子源码树 (`find` 全盘无 cann_ops / ops-transformer), 读不到 FA 的内核。
      ★但不需要读 —— **我们自己的两条臂就是对照**:
        我们的 `Cast(score, raw, CAST_NONE)` 里 raw 是 **int32**, 即 QK 走量化 matmul;
        反量化 = int32->fp32 的 Cast + 逐量化块的 Muls, 两条全宽指令, 都在 AIV 上。
        FA 用 fp16 直接算, 这两条它没有, 代价是 cube 多花 63% (82729 对 50767)。
      条数核对: control 臂约 7 条全宽指令对 FA 的约 5 条, 比值 1.4;
      实测 aiv_vec 137343/92023 = **1.49**。吻合。
    corrects_my_own_F142_guess: >
      ★F142 里我猜 "FA 可能把部分向量工作挪到了 cube 上"。**方向反了**:
      不是 FA 把向量活挪给 cube, 是**我们**用量化把 cube 的活挪给了向量。
      两者在画像上长得一样 (FA cube 大、vec 小), 但归因相反, 对策也相反。
    the_general_principle: >
      既然窗口由 AIV 的吞吐决定 (F142), 那么:
        **凡能从 AIV 搬到 AIC 的工作都是赚; 凡从 AIC 搬到 AIV 的都是亏。**
      量化就是后者的一个实例 —— 它在 cube 受限的形状上是对的, 在本形状上是错的。
    H14_is_this_principle_already_measured: >
      台账里的 H14 (QK 经 fixpipe 反量化直出 fp16) 正是这条原则的一个实例:
      把反量化从 AIV 搬进 fixpipe。在 h11b 上实测 control **-1.96%** / expcast **-5.82%**,
      abgate 三条判据全过。**只被精度闸拦住** (decoded_reference 1.1089% 对 1% 门限),
      甲方否决过一次。存档见 vc-attention/delivery/OPTIONAL_FP16_S.md。
      ★它是在 h11b 的结构上量的, h26 的结构已不同 (当时 fixpipe 更紧), 要用须重测。
    new_candidate_not_yet_tried: >
      顺着同一条原则找到一个台账里没人试过的: **ReduceSum 不必用向量单元做**。
      给 V 拼一列 1, PV 的 matmul 多出的那一列就是 rowsum(P) —— 搬到有富余的 AIC 上。
      ★**不逐位等价**: 向量 ReduceSum 的求和次序与 cube 的累加次序不同, 且当前 ReduceSum
      作用在 fp32 的 score 上而 matmul 会作用在 fp16 的 ph 上。要走精度闸。
      本轮先用诊断构建量它的单价 (手法与 F136 量 Gather 相同), 再判值不值得提。
      ReduceMax **不可**用此法 —— 取最大值不是 matmul。
    what_this_says_about_KFC: >
      本轮的分析没有给 KFC 找到任何新的理由, 反而又补了一条反证:
      FA 的优势来自**不量化**这一算法选择, 不是来自 KFC 的客户端/服务端分工。
      F142 的结论不变: **建议不做 KFC**。
      ★但 F142 列的三种可能里, 本轮排除了 (2) 的原始形式并把它改写成了上面那条原则 ——
      这条原则本身是有用的产出, 它指出了一类此前没有系统找过的候选。

