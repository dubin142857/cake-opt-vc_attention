  - id: F59
    t: 2026-10-26
    claim: >
      V-Smooth 的具体语义 (vc-attention/src/vc_attention/core.py prepare_value_tile, 附录 B):
        mean   = tile.mean(-2, keepdim)                      # 每 128-token 块、每通道
        resid  = tile - mean
        vscale = amax(|resid|, -2) / 448                     # 每块每通道
        vscale = max(vscale, |mean| / finfo(FP16).max)       # 防溢出下界
        payload= (resid / vscale).clamp(-448,448) -> E4M3
        smean  = (mean / vscale) -> FP16
      在线恢复: P @ V = (P @ payload) * vscale + rowsum(P) * smean。
      rowsum(P) 即内核已有的 softmax 分母 mass, 故恢复**不需额外归约**
      (PAPER_ALIGNMENT: "分母与均值恢复共同使用解码后的 P")。
      另需 group_values 产出的 K/V 同序排列 (labels.argsort stable), 属主机侧重排。
    implication: >
