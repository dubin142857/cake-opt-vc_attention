  - id: F151
    t: 2026-10-28
    kind: root_cause_partial
    title: "两个 MatmulImpl 共用物理 L0A/L0B 且共用 M_MTE1 事件号 (结构已确证, 非竞态成因)"
    evidence_in_cann_source:
      - "tbuf_pool_l0_base.h:57-58 —— 每个实例无条件 InitBuffer 整块 L0A 与整块 L0B。"
      - "kernel_tpipe_impl.h:304-352 —— TPipe::InitBuffer(TBuf) 顺序分配 (maxAddr 累加);
         越界断言 curPoolAddr <= bufferInitLen 写在 #if ASCENDC_CPU_DEBUG 里, 设备侧不存在。
         两个实例共取 128 KB, 而池只有 64 KB (matmul_config_utils.h:91)。"
      - "主机 vc_torch.cpp 的 set_dbL0A(1)/set_dbL0B(1) 使 isL0Db 为假,
         两个实例的 l0PingPongFlag_ 恒为 0, 连事件号都共用。"
      - "CANN 为此提供的开关是 MatmulConfig::isA2B2Shared (matmul_config.h:266),
         注释原文 'enable all Matmul instance share the double buffer feature of A2 and B2';
