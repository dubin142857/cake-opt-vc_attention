      ★另有一处**同量两值**: cube 算术下界, 架构草稿写 43.3 ms (int8 QK + fp16 PV),
        台账另一处写 50.9 ms。两者不一致, 也未解决。
      ★**在这条解决之前, 任何"Laser 的 cube 效率如何"的结论都不要下** (E23: 两个来源冲突先查)。
    next: >
      1. 解那个算术矛盾: 查 `cube_ratio` 的分母定义 (E13: 先搜列名), 并在**我们自己**的
         产物上验一遍 (我们的 aic_cube_time/aic_time = 0.2736 与 aic_cube_ratio 0.272 对得上,
