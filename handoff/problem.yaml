    method: >
      在 h26 的祖先链上逐级换产物, 用 race_rate.py (同一输入进程内连调 N 次,
      逐位比较) 量触发率。只换 .so 的前提单独核过: h15/h16/h16b 三级的
      api.py / reference.py / __init__.py 与 h26-bitdecode 逐字节相同。
    measured:
      - {build: h15, commit: 539ccec, tile_m: 32, trials: 23, hits: 2, rate: "9%"}
      - {build: h16, commit: b70354f, tile_m: 32, trials: 23, hits: 2, rate: "9%"}
      - {build: h26b, commit: 0979605, tile_m: 32, trials: 23, hits: 23, rate: "100%"}
      - {build: h15, commit: 539ccec, tile_m: 64, trials: 23, hits: 0, rate: "0%"}
      - {build: h15, commit: 539ccec, tile_m: 32, trials: 47, hits: 4, rate: "8.5%"}
    conclusion: >
      h15 与 h16 同率, 故 H16 不是引入点。触发率随版本变快而从 9% 升到 100%,
      这是**暴露率**的变化而非引入点。配合 git 证据 —— mmq/mmv 两个 MatmulImpl
      自 da6026b (最初的 Ascend 移植) 引入后再没有任何提交动过它们的声明 ——
      缺陷属于原始移植, 本项目九级优化只是把它从偶发变成必现。
    delivery_implication: >
