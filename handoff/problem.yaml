  - id: F213
    t: 2026-10-30
    kind: decision
    title: "★窗口改单块: 精度代价基本为零, 但**窗口不是真正的约束** —— 融合两趟等价于 CHUNK=1, 不划算"
    measured_cost: >
      离线量 (提交 244400b 的 `scripts/window_rmse_probe.py`, 只改 `payload_reference` 的
      `tile_width`, **不碰内核也不碰交付物**; 口径与 benchmark 一致: seed 0 · 32 个查询行
      · 对 `dense_reference`; 用 payload_reference 代理内核输出成立, 两者差 9.5e-5 量级):
        control  chunk 窗口 512 -> **2.975507 %** ; 单块窗口 128 -> **2.975519 %**  (+0.000012 pp)
        expcast  chunk 窗口 512 -> **4.360672 %** ; 单块窗口 128 -> **4.364237 %**  (+0.003565 pp)
      ★**精度代价基本为零** (control 的相对变化 0.0004%)。
    but_the_real_constraint: >
      ★读内核注释 (vc_kernel.cpp 的 chunk 分阶段处) 才看清: 两趟法**不是为了窗口**, 而是因为
        "chunk 内跨 key 块在 L0C 上累加 O, 要求整个 chunk 的 P 用**同一个**归一化基准;
         单趟只能用运行最大值, 基准逐块变, 累加就不成立"。
      故"融合两趟"**等价于 CHUNK=1** (O 每个键块搬一次), 而 chunk 设计当初正是为了摊薄它。
      代价清单:
        - `L0C_to_GM` 由 **186.0 GB 回到约 224 GB** (+20%; F191 测过旧设计是 223.8);
        - **跨核握手次数 x4** —— F199 实测过这个方向: 仅把 S_READY 改成每块就**慢 3.4%**;
        - AIV 读 O 也由每 chunk 一次变每块一次。
      收益只有: AIV 每块省约 3/10 条向量操作 + 省 48 KB UB。
    decision: >
      ★**不做**。精度不是障碍, 但收益换不回那三项代价, 其中一项 (握手 x4) 已有同向的实测负结果。
      ★方法学: 问"这个常量能不能改"之前先问"**它为什么是现在这个值**" ——
        本例里窗口是**结果**而非原因, 原因是 L0C 的 chunk 累加。
        若只看 RMSE 代价就动手, 会把一笔已测得的收益 (F191 的 223.8 -> 186.0) 白白退回去。
    next: >
      AIV 仍是瓶颈 (2.21 对 AIC 的 1.36 us/chunk), 分解 (稳态):
        **t2_vec 46.8%** (Sub x2 + Exp + ReduceSum, 契约内已无明显冗余) ·
        t1_setup 23.4% · wait_s 8.3% · chunk_tail 7.3% · t2_publish 5.9% ·
        pv_work 4.4% · t1_vec 3.9% · wait_o 0.0%。
      ★下一步**不要再猜**: 先用 `MetricsOff/On` 把 AIV 的标量时间按趟 1/趟 2/chunk 尾
        逐段分解 (已校准, 只对 aiv_scalar_time 有效), 看 t2_vec 里到底是向量执行还是发射开销,
        再决定动哪一条。

  - id: F214
    t: 2026-10-30
    kind: result
    title: "★★与 CANN FA 同机对剖: 它 cube 70% 我们 25%; 差距的链条是 **chunk 两趟 -> UB 满 -> 查询块只能 64**"
    why_this_measurement: >
      "为什么我们比参考实现慢"此前只有端到端黑箱数字 (Laser 95.30 · CANN FA 142),
      **从未测过对方的内部剖面**, 于是只能靠机理猜 —— 这正是 2026-10-29 用户指出的
