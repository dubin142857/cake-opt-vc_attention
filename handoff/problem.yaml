  - id: E51
    t: 2026-11-02
    kind: prediction
    move_class: 速率        # 仍在速率轴: 让回一条整块宽度换回精度, 元素数与次序不动
    title: "E51 (测前写定): 甲-8 —— 把行最大值整条维护在**未乘 qs 的分数域**, 使 fp16 的移位值**零舍入**"
    i_corrected_my_own_plan_before_building: >
      ★甲-8 原文写的理由是"用 Sterbenz 引理, 相近同号浮点相减精确"。动手前按误差传播算一遍,
        **那个理由不成立**: `fp16(-m)` 的误差是 `|m|*eps`, 乘回 qs 之后是 `qs*|m|*eps = |rowmax|*eps`
        —— **与现在完全相同**。单凭"换个域"不解决问题。
      ★**真正起作用的是另一件事**: 现在的 `rowmax` 是 `qs x max` 这个**计算出来的乘积**,
        把它转 fp16 必然有舍入; 而未乘 qs 的 `smax` 就是 `chunkScore` 里**存着的某一个
        fp16 值本身** —— `tmaxh` 由 `WholeReduceMax<half>` 从 fp16 源选出, `Max` 不产生新值,
        故 `rowmax` 恒等于某个已存 fp16 值, 转 fp16 **零误差**。
        移位值由"有 `|rowmax|*eps` 误差"变成"精确", 这才是收益的来源。
      ★记一笔: **方案对但理由错, 和方案错一样危险** —— 理由错会让下一个人按错的理由
        把它推广到不成立的地方。本条在动手前改正, 不是事后。
    design_unknown_resolved_by_reading: >
      ★简报标的"设计未知"已读清:
        · `m` (跨 chunk 的 running max) 只在**一处**更新: `Adds(m, rowmax, 0.0f, ROWS)`;
        · `m` 初值 `-3.402823466e38f`; 在未乘 qs 的域里它同样是"尚无最大值"的哨兵,
          `Sub` 后仍是大负数, 乘 qs 后仍是大负数 (qs 约 1e-4), `Exp` 给 0 —— 语义不变;
        · 最大值与正标量相乘**可交换**: `max(qs*s) = qs*max(s)` (qs > 0), 故整条链
          改在未乘 qs 的域里维护, 数学上等价。
    change: >
      chunk 头部 (ROWS 量级, 每 chunk 一次):
        · 删掉 `Muls(rowmax, rowmax, qs_scalar, ROWS)` —— `rowmax` 从此是**未乘 qs** 的;
        · `Max(rowmax, rowmax, m)` 照旧 (`m` 也改为未乘 qs);
        · `Sub(alpha, m, rowmax)` 之后**新增** `Muls(alpha, alpha, qs_scalar, ROWS)`, 再 `Exp`;
        · 控制支的填值: `Muls(rowmaxNeg, rowmax, -1.0f)` -> `Cast(rowmaxNegH, ...)` **零舍入**
          -> `Brcb(bmaxh, ...)`;
        · expcast 支的填值要的是**已乘 qs** 的: 新增 `Muls(tmax, rowmax, -qs_scalar, ROWS)`
          (借用 `tmax` 槽, 它只在趟 1 活) -> `Brcb(bmax, tmax, ...)`。
      趟 2 控制支:
        · `Axpy<half, half>(workh, sc, half(1.0))` 得 `s - smax`;
        · **新增一条整块** `Muls(workh, workh, qs_half, ROWS * NB)` 得 `qs*(s - smax)`。
      ★`m = rowmax` 那一行不动, 只是含义变成"未乘 qs 的 running max"。
    predictions: >
      ★三条判据**缺一不可** (甲-8 写定: 三者缺一则不如回退 fp32 趟 2):
        (1) `decoded_reference` 最大值由 **1.682e-3** 回到 **< 3e-4**;
        (2) `vc910_card_stable` 恢复 **rc=0** (阈值 1e-3);
        (3) `aiv_vec` 相对生产基线 **143601 us** 的降幅仍 **>= 10%**。
      ★(3) 的点估计: 新增一条整块 fp16 `Muls` = 32 个 repeat (4096 个 half / 128),
        按 F241 的 fp32 整块 12.2 ms (64 个 repeat) 折半约 **6 ms**。
        故 `aiv_vec` 由 119052 升到约 **125000**, 降幅由 17.10% 回到约 **13%**。
        区间 **11%-15%**; 低于 11% 说明新增的那条比估的贵, 要查。
      ★dense RMSE control 预计由 **2.982435%** 回落到 **2.9812%-2.9818%**
        (即回到 E50 之前 2.981115% 附近, 因为移位值不再有舍入, 残余只剩 fp16 的 exp 本身)。
      ★expcast **逐字不变**: dense RMSE 仍 **4.362025%**, 141 例里 expcast 那半不变。
      ★`aic_*` 六项不变 (容差 2%)。fixed core 预计 **175-178 ms** (比 E50 的 174.33 略慢)。
