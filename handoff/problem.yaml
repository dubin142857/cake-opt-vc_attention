      ★按 E37: 判据写在**组合**上。单独做 (1) 会让 vec 回到两遍 (Cast + Muls(qs)),
        收益只剩流量那一份; 单独做 (2)(3) 又要求 fixpipe 已经只发一次。三件必须一起。

  - id: F239
    t: 2026-10-31
    kind: result
    title: "★`Axpy<float,half>` 的形参已数值坐实, 且**跨步各按自己的数据宽度**算 —— F238 的 (a) 关闭"
    measured: >
      探针 `scripts/probe_axpy.py` + 内核 `vc910_axpy_probe`, 卡 4, 一次构建全过:
        C1 count 形与 `base + f32(x) * f32(f16(a))` **逐位相同** (0/4096 不符)。
