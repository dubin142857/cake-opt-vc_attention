      **三个缓冲各自正好半满 -> 处处 ping/pong**。且 cube1/cube2 按 chunk 分阶段,
      同一时刻只有一个占 L0, 故能整块用。★这就是 T3 "128×128 正好填满缓存半区" 的**作用**
      —— 我此前把它记成一条技巧, 没说清它使双缓冲成为可能, 而双缓冲才是重叠的前提。
    revised_plan: >
