    lesson: >
      ★"占比最高的那条流水"才是 binding, 不能因为某条 pipe 的名字像瓶颈就选它。
      此前把 scalar 排除在 max(pipe) 之外的理由是"它含跨核等待" —— 那个理由在旧构建上成立,
      在 h26 上已被探针否掉 (wait_p 1 tick)。**排除一条 pipe 要有当期证据, 不能沿用旧结论。**

  - id: F189
    t: 2026-10-29
