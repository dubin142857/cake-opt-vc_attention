      dslir:
        registered: "本机 Python 3.11.14 下 ast.parse 即报 SyntaxError"
        measured: >
          现象属实但**版本写错**: 本机 `python3` 是 **3.10.12**; 另装有 3.11.14,
          两者都在同一行报错。该登记据此把归属判给 cake/master 而不再追。
      dslapi:
        registered: "同 dslir: cake/master 带入, 它 import dslir"
        measured: >
          ★**完全不成立**。`grep -n "import dslir" core/dslapi.py` 为空 —— 它根本不 import dslir。
          真因是外部包 `cannbotdsl` 不在本机: 按教训二做了不预设位置的搜索
          (根 /data0 /data1 /root /usr/local/lib /opt /home, 深度 8, 另查 pip 列表), 确实没有。
    defect_1_dslir_one_statement_killed_the_whole_module:
      locus: "core/dslir.py:525-526"
      construct: 'f"…{'', ''.join(f''{p} 差 {d[''arrive''] - d[''wait'']:+d}'' …)}" —— 内层 f-string 用单引号作定界符而内部又用单引号取下标'
      rule: "PEP 701, **Python 3.12 才允许**。3.10 与 3.11 上整个文件 ast.parse 失败。"
      scope_measured: >
        只此一条语句。我第一次写的枚举脚本 (把报错行换成 `pass` 再解析) **方法错了** ——
        那会破坏多行语句的结构, 于是空转 40 轮刷同一行。改用"修好再解析"才得到确定答案。
      fix: >
        照本文件上两行 (`bits = ", ".join(...)`) 的既有写法, 先算成变量再插值。
      equivalence_proof: >
        合成数据上跑改后的表达式, 与按原式两段隐式拼接手工构造的期望串**逐字相同**
        (含 `:+d` 对 0 产出 `+0` 这个边角)。3.10 与 3.11 均解析通过。
      result: "dslir 自检 10 条全过 rc=0 —— 这 10 条在本机**从未跑过**。"
    defect_2_dslapi_a_hard_refusal_wearing_the_mask_of_a_failed_criterion:
      locus: "core/dslapi.py selftest() 首行 find_pkg()"
      cause: >
        5 条判据全部要读 cannbotdsl 包; 包不在时 find_pkg `raise SystemExit(2)`,
        那个 2 一路穿到聚合, 显示成 `dslapi FAIL rc=2` —— 与"某条判据抓不住了"**同一个外观**,
        而两者的下一步完全不同。与 F172 的 trust 缺陷二是同一结构, **第三次**。
      fix: "按 trust/aprof 的既有写法改成可见的跳过: 条数报出来, 不混进未过。"
      mutation_proof:
        - "让 find_pkg 返回一个内容不对的包 -> 5 条全部跑出 FAIL (rc=5), 证明判据没被改哑"
        - "包确实不在 -> 走跳过, rc=0, 并打印'5 条因外部依赖缺失未跑'"
    a_method_error_of_mine: >
      中途我报过"dslapi 在 core/opdbg 里一次都没出现, 那它怎么进到未过集合的" ——
      literal grep 的结论对, 推论错: `criteria_rows()` 会**自动发现**凡文本里含
      `"--selftest"` 的模块。不在显式表里不等于不参与。
    result: "未过 4 -> 2 (只剩 attnplan 2 条与 aprof 18 条, 两者均已逐条归属); 登记表 6 -> 4 条"
    lesson: >
      ★**登记项会把一个错误的归因固化下来, 而且越具体越可信**。dslapi 那条写着
      "同 dslir: 它 import dslir" —— 具体、可检、而且一检就假, 却挂了六天没人检。
      本会话三次撞同一件事 (F170/F172/F174): 模块级 rc 的粒度上, 假归因不可证伪。

