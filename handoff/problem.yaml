      - `TRACE_START(apid)` / `TRACE_STOP(apid)` **单参形式**在 2201 上走
        `set_lpcnt(ASC_PROF_START_EVENT|apid); prof_mark_event();`, 可用;
        **双参 `TRACE_START(pipe, idx)` 在 2201 上是空宏**, 只有 3510 映射到 `asc_mark_stamp`。
      - `asc_mark_stamp` **本机不可用** (仅 `__NPU_ARCH__ == 3510`)。
    why_it_matters: >
      ★它正好补上 F205 暴露的漏洞: msprof 的 `aiv_scalar_time` 是**整核聚合**且**混入了阻塞等待**,
        不能用来判 AIV 的真实工作量。用 `MetricsProfStart/Stop` 把两处 `CrossCoreWaitFlag`
        排除在计数区间外, 就能拿到**硬件计数的**干净 `aiv_scalar_busy`, 独立复核相位探针。
      ★代价: 它两侧各插一道 `pipe_barrier(PIPE_ALL)`, 是扰动; 只适合测量构建, 不进生产。
    not_yet_done: "尚未接入。接入时按常量开关做成可回退的测量变体, 并与相位探针互为旁证。"

