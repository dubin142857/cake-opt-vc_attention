    t: 2026-10-31
    kind: analysis
    title: "★订正 F246 的分支判断 (基线与 E38 走的是**同一条**分支); 并驳回我自己刚起的一个账目修正。缺口余 5.5 ms"
    correction_to_F246: >
      ★F246 写"基线的 `ReduceMax<float>` (128 > 64) 才在贵分支, E38 的 `ReduceMax<half>`
        (128 == 128) 走便宜分支"。**这句不成立。**
      ★核实: `MAX_REPEAT_TIMES = 255` (`impl/basic_api/utils/kernel_utils_constants.h:40`)。
        `BlockReduceByLastAxis` 的分支界是 `lastAxis >= elePerRep && lastAxis <= MAX_REPEAT_TIMES * elePerBlk`:
          fp32: elePerBlk=8, elePerRep=64, 界 = 2040; last=128 落在区间内 -> `DoReduceByRep`
          fp16: elePerBlk=16, elePerRep=128, 界 = 4080; last=128 落在区间内 -> `DoReduceByRep`
        **两者进的是同一个函数**, 不存在"贵分支/便宜分支"之分。F246 把界算错了。
      ★按 F224 的处理方式**追记订正**, 不改 F246 原文。
    a_correction_i_started_and_then_rejected: >
      ★读到 `DoReduceByRep` 的暂存拷贝后, 我一度准备把 E38 的账也改掉, 理由是
        "fp32 暂存比 fp16 暂存贵一倍, E38 顺带省了 6 ms 没计入, 所以缺口其实是 17.5 ms"。
      ★**逐字读那行掩码后驳回**: 拷贝量是
        `SetVectorMask<T, COUNTER>(0, firstAxis * elePerRep)` —— 乘的是 **elePerRep**, 不是行长。
          fp32: 32 x 64 个 float  = 8 KB
          fp16: 32 x 128 个 half = 8 KB
        **两者搬的字节数相同**, 不存在减半。E38 的账不需要改, 缺口仍是 F245 记的 11.5 ms。
      ★留痕的理由: 这是"用一个刚读到的机制去重算一笔旧账"时的典型失误 ——
        机制对了, 但把它套到了一个它并不决定的量上。拦住它的是**把那一行的乘数逐字读出来**,
        而不是用"fp32 比 fp16 宽一倍"这种一般印象。
    gap_accounting_now: >
      缺口 11.5 ms (F245 的对账): 已定因并收回 **5.99 ms** (F247), 余 **≈5.5 ms**。
      ★E38 删掉的确实是**两遍整块**, 已核对 `git show f0c15b0`:
        · `Cast(sc, rawAll[cur * ROWS * N], CAST_NONE, ROWS * NB)` —— 一条整块;
        · `Muls` 是 `KSB_PER_TILE = NB / K_SCALE_BLOCK = 1` 层 x `off` 两段 64 列,
          合起来正好一整块。
        故"去掉两遍 ≈ −24.4 ms"这个前提成立, 不是前提错。
      ★趟 1 现在已**没有整块向量操作**了, 只剩 `WholeReduceMax<half>` 一条,
        加上 ROWS 量级的 `Cast(tmax, tmaxh, ROWS)` 与 `Max(rowmax, rowmax, tmax, ROWS)`。
        F246 列的候选 (b) 尾部掩码 `SetValue` 与 (c) `Cast(tmax)` 都是 ROWS 量级, 撑不起 5.5 ms;
        候选 (a) DataCopy 落点改变走的是 **MTE2**, 不计入 `aiv_vec`。
        **三个候选都不够格**, 不应照 F246 的 next 直接做。
      ★另记: "12.2 ms = 一遍整块的单价"这个数本身是**解释**, 不是直接测量 ——
        F245 测的是"`fill+Axpy` 对 `Cast+Muls+Add`"这一对具体写法的差分 (+12.2),
        F241 测的是"填值那一遍"的单独代价 (+11.9)。两者互相印证, 但按 E7,
        该单价只适用于**简单算术整块遍**, 不适用于 `Exp` 这类超越函数遍
        (趟 2 的 `Exp` 显然远贵于一条 `Adds`)。再往下用这个单价要先声明这一条。
    next: >
