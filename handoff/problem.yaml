  - id: F158
    t: 2026-10-28
    kind: falsified
    title: "isA2B2Shared 开关确实生效 —— 故「切开 L0A/L0B 不足以修复」这一否定结论成立"
    my_first_activation_test_was_invalid: >
      ★第一版判活设计: 开开关但不改 PV 的 baseK, 预期"超限的分块装不下半个 L0B 会算错"。
      实测 tile_m=64 验收全过且指纹与正确值**逐位相同** (2ea36f7042082394)。
      原因: 共享计数器每个 tile 恰好被 mmq 与 mmv 各推进一次, 于是 mmq 永远拿半区 0、
      mmv 永远拿半区 1; mmv 的 64 KB 从 32768 起算回绕进半区 0, 而读写用同一个回绕地址、
      且 mmq 的数据此时已消费完 —— **超限也能算对**。
      所以"数值正确"既不能证明开关惰, 也不能证明它活。这个设计错误值得记住:
      我用"会不会算错"去判一个**地址分配**问题, 而地址错位在特定序下是自洽的。
    valid_test: >
      改用不依赖数值的判法: `AscendC::Impl::Detail::gA2B2DBFlag_` 只在共享特化被实例化时
      才进产物。实测 h26b 与 h30 (开关 false) 的 .so 里 "a2b2" 出现 **0** 次,
      h32 (开关 true, 产物 0d2e62dae361490d) 出现 **1** 次 —— 开关生效。
      另: 编译命令的 include 路径指向 asc/impl/adv_api 与 asc/include/adv_api,
      与我读的源码树一致, 故 F151 的源码依据成立。
    conclusion: >
      h28 (开关 + PV baseK 减半) 触发率仍是 100%, 这个否定结果**成立**:
      把 L0A/L0B 切成两个半区**不足以**修复该竞态。
      两个 matmul 争用的共享物不止 L0 缓冲。
    next_lead: >
      关掉 enUnitFlag 使触发率 100% -> 27.7% (此前被我当作"混淆结果"搁置, 现在它是线索)。
      unit flag 路径下 CubeOutBuffer 的 EnQue/DeQue/FreeTensor **全是空操作**
      (cube_out_buffer_unit_flag.h), 写回完成只靠 Destroy() 里一次 FIX_M;
      且 End() 里有 SetMMLayoutTransform(0) —— 指向 Cube 的**每核配置寄存器 / fixpipe 状态**
      这一类共享物。可证伪的下一步: 在 isA2B2Shared 已开的基础上再关 enUnitFlag,
      若触发率归零则共享物锁定在 fixpipe/配置侧而非 L0。
    tool_impact: >
      ★C15 是**错误级**判据, 而它原本给的两条改法里有一条 (开 isA2B2Shared) 现已被实测否定。
      判词已改: 明说该开关不足以修复, 已验证有效的是显式串行。
      错误级判据给错改法比没有判据更糟 —— 这类更正优先于任何新功能。

  - id: F159
    t: 2026-10-28
    kind: root_cause
    status: bounded
    title: "成因边界确定: 不是缺某一条跨流水序, 而是两个实例共享的每核状态太多"
    ladder:
      note: "同一探针 core.detrace rate, 最高暴露配置 tile_m=32 control, 48 趟"
      rows:
        - {变体: "无序 (h26b)", 产物: 4d20b857d25f3541, 触发率: "100% (47/47)"}
        - {变体: "isA2B2Shared + PV baseK 减半 (h28)", 产物: "(未存)", 触发率: "100%"}
        - {变体: "isA2B2Shared + enUnitFlag 关 (h33)", 产物: 14f7157d32591d7f, 触发率: "100% (47/47)"}
        - {变体: "只下 M->MTE1 (h34)", 产物: 1c98e9ef87dd7255, 触发率: "53.2% (25/47)"}
        - {变体: "M->MTE1 + FIX->S (h35)", 产物: e500e577b89716e0, 触发率: "34.0% (16/47)"}
        - {变体: "PipeBarrier<PIPE_ALL> (h30, 已交付)", 产物: 3494c48d2ce2b73e, 触发率: "0% (0/47, 两会话)"}
    reading: >
      每加一条跨流水序都真实削掉一块 —— 且下降不是时序假象, 因为加指令让 AIC 变慢,
      按 F153 的经验律本应**抬高**触发率。但没有任何单条能关上。
      故缺的不是某一条边, 而是两个 MatmulImpl 共享的每核状态太多:
        - L0A/L0B 缓冲 (H28/H32 已证切开它不够);
        - fixpipe 的 dtype/layout 配置 (mmq 出 int32、mmv 出 fp32, 配置不同且是每核寄存器);
        - 事件号本身 —— TPipe::FetchEventID 返回 sff0(eventOccupy) 却**不置位**,
          所以同类事件的所有调用方拿到的是同一个号 (只有 AllocEventID 才占号);
        - 其余未逐一枚举的 Cube 配置寄存器。
      CANN 的 isA2B2Shared 只协调 L0 双缓冲在多实例间的归属,
      **从不承诺两个实例可以并发**。唯一可靠的用法是不让它们在时间上重叠。
    implication_for_the_shipped_fix: >
      已交付的 PipeBarrier<PIPE_ALL> (53ec7af) 是正确选择: 三个更便宜的替代
      (isA2B2Shared / 关 enUnitFlag / 单条跨流水序) 都实测不成立,
      而它的代价只有 tile_m=64 上 +1.14%/+0.41%、tile_m=32 上 0。
    stopping_rule: >
      ★在这里停止继续窄化, 不再加第四条边。理由: 三次实验已把空间界定清楚,
      而按收敛纪律, 一次端到端 PASS (全屏障 0/47) 胜过继续演化假设。
      再加一条边大概率只是继续削而不归零, 不产生新信息。

  - id: F160
    t: 2026-10-28
    kind: cross_artifact_verify
    title: "H30 在 CANN 发行语料上跨算子验证: 不区分路径则 38 条命中里 36 条是误报"
    corpus: >
      /usr/local/Ascend/.../opp/built-in/op_impl/ai_core/tbe/impl 下 4444 个 ascendc 头文件,
      其中含 Matmul 的 774 个, 声明两个以上实例的 **57 个**。
    first_run_refuted_the_criterion: >
      ★按初版 H30 (只要发射点之间没有 PipeBarrier<PIPE_ALL> 就报错误级),
      57 个里 38 个命中。而其中 bmm1->bmm2 / qkBmm->pvBmm 这些 flash-attention 内核
      与我们的 QK/PV **结构完全同形**, 发射点之间只有 End()。
      几十个生产内核同时有同一缺陷不合理 —— 所以是判据太宽。
    discriminator_found: >
      `MatmulImpl<...>` 是**内部**类型, 写它就是明确绕开 KFC 客户端, 两个实例直接驱动
      本核 cube; `Matmul<...>` / `matmul::Matmul<...>` 是**公开**类型, 混合核下解析成
      客户端, cube 由服务端按消息执行 (matmul_server.h 的 Process(msg, funID))。
      我们的内核注释自己写着 "Local Cube implementation: no KFC Matmul client and
      no REGIST_MATMUL_OBJ" —— 走的正是前者。
      ★注意 REGIST_MATMUL_OBJ 可能在**同目录的 .cpp** 里 (swin_attention_score_quant 即如此),
      只看单个头文件会误判。
    after_refinement:
      错误级: "2 (同一文件两处路径: ops_nn/ascendc/mat_mul_v3/mat_mul_deterministic_splitk_kernel.h)"
      提示级: "36 (公开类型或有 REGIST, 路径取决于编译模式)"
    ground_truth_note: >
      发行语料里**显式用多个本地 MatmulImpl 的只有 1 个**, 且它的流程里带
      PipeBarrier<PIPE_ALL> —— 但那几处屏障挂在跨核同步点 (SyncAll / NotifyEvent) 上,
      不是专为实例切换放的, 故**不能**当作"官方就是这么修"的直接证据。
      能说的是: 我们那个配置 (多个显式本地 MatmulImpl 且发射点之间无屏障)
      在整个发行语料里几乎没有先例。
    split_per_dual_loop:
      通用可升_mature:
        - "H30 的级别判别 (内部类型 vs 公开类型 / REGIST 在编译单元内) —— 与算子无关。"
        - "share 表本身 (每核共享状态 x 占用方 x 重叠窗口, 含循环回边)。"
        - "H31 (FetchEventID 只查不占) —— 与算子无关。"
      算子专属_investigate_further:
        - "vc_attention 的回边窗口未加固: 代价依据是 +24%, 属本算子的取舍, 不进判据。"
        - "语料里那 36 个提示级是否真的安全, 需逐个看编译模式才能定, 未逐一核。"

