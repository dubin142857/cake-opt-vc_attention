    next: >
      ★目标: **tile_m 64 -> 128**。UB 粗算 (ROWS=64, 单块窗口即 scoreBuf = ROWS*N*4 = 32768):
        score 32768 + raw 2 槽 65536 + p 16384 + acc 32768 + pv 32768 + sub 32768
        + vs 512 + state 3072 + lut 512 + cmp 1024 + brcb 4096 = **222208 > 196608**, 仍超 25600。
      可腾的两处: raw 退回单缓冲 (-32768) 或 subBuf 仅 expcast 路径才占 (-32768)。
      **须精算后再动**, 且 `vc_torch.cpp` 现在只允许 tile_m == 64, 镜像常量按 F190 全找出来。
      L0 侧: tile_m=128 时 staged_l0a 与 staged_l0c **恰好填满**, 可行但零余量 (F203)。
      ★先写定 E29 再动手。

  - id: F215
    t: 2026-10-30
    kind: result
    title: "★★读到 Laser 源码: 它把 softmax 的**重标定与归一化搬到 cube**(对角阵乘), 这才是 128 块与一趟法的前提"
    source: >
      用户给出 `/data0/z60106022/MindIE-SD-dev.zip` (29 MB, 2026-10-28, commit 50c3d813)。
      解出 `csrc/ops/laser_attention/op_kernel/` —— `CubeForward.h` · `VectorForward.h`
      · `matmul_const.h` · `address_const.h` 等。**不需编译即可读出生产消费结构。**
    tile_geometry_confirmed: >
      ★`matmul_const.h`: `BASE_BLOCK_SIDE_LEN = 128` ("BASE_BLOCK shape ：[128 * 128]")
        · `CUBE2_LENGTH_M/K/N = 128` · `MAX_LENG_PER_UB_PROC = 16384` (= 128x128, 单个 ping)。
      ★即 Laser 的查询块是 **128 行**, 我们是 64。这与 F214 从流量比 (297.6 对 158.4 GB)
        推出的"它的查询块约是我们的 2 倍"**完全吻合** —— 推断现由源码坐实。
    the_real_mechanism: >
      ★`CubeForward.h:387`: `mad(l0_c_buf, l0a_diag, l0b_out, 128, 128, 128, ...)` ——
        **用对角阵在 cube 上做矩阵乘**。两处调用:
          L197 `diag_matmul(result_gm, curr_rowmax, 2, false)`  -> 用 rowmax 对角阵**重标定 O 累加器**
          L343 `diag_matmul(src[idx].out, curr_rowsum, ky, true)` -> 用 rowsum 对角阵做**最终归一化**
        (`l1_local_diag_ping_/pong_` 在 L1 的 256 KB / 320 KB, 各 64 KB。)
      ★**这两步在我们这边是 AIV 的向量活**: `acc = acc*alpha + pv` 与 `acc * (1/l)`。
    why_it_cascades: >
      ★把重标定搬到 cube 之后, **AIV 再也不碰 O 累加器**, 于是:
        - 不需要"整个 chunk 共用一个归一化基准" -> **一趟在线 softmax, 逐 128x128 块**;
        - 不需要把整 chunk 的分数以 fp32 留在 UB (我们的 `scoreBuf` 占 64 KB);
        - UB 腾出来 -> **基本块做到 128x128** -> K/V 重读减半, 每条向量指令覆盖的数据翻倍。
      ★代价是多两次 128^3 的 mad (约 +50% cube 工作量), 而 **cube 正是闲着的那个单元**
        (我们 25.2%, CANN FA 70.1%)。**它是把工作从瓶颈单元挪到空闲单元。**
    our_mirror: >
      ★`vc_l1l0_map.h` 的 `L1_DIAG_PING/PONG` (4/5 x L1_SLOT = 256/320 KB) 与
        `L1_ACC_PING/PONG` 四个槽, 注释写着"Phase 3 预留: 对角阵与累加器驻留" ——
        **地址与 Laser 的 `l1_local_diag_ping_/pong_` 逐字对应**, 即早先有人读懂过这一层并预留了位置,
        但一直没实现。★而我在 F210 把这四个槽**挪去做 PV 的 P/V 双缓冲了**, 届时需重新规划 L1。
    supersedes_roadmap: >
      ★F214 把目标定为 "tile_m 64 -> 128" 是**对的方向但不是起点**:
        128 块是**结果**, 前提是先把重标定搬到 cube。只改 tile_m 而不改结构, UB 仍然装不下
        (F214 已算: 222208 > 196608)。
      ★正确次序: (1) 对角阵重标定搬 cube -> (2) 一趟在线 softmax, 去掉 chunk 两趟与 64 KB scoreBuf
        -> (3) 基本块 128x128。**每一步单独测, 按 E10 把流量与重叠分开核。**
    still_unknown: >
      Laser 95.30 ms 比 CANN FA 的 119.7 还快 1.26x。本条解释的是"为什么它们都比我们快",
      **尚未解释 Laser 相对 FA 的那一层** —— 需要继续读 `VectorForward.h` 与
      `AddressMappingForwardOnline.h`, 或把 MindIE-SD 编出来直接剖面。

  - id: F216
    t: 2026-10-30
    kind: lesson
    title: "★「把工作从瓶颈单元挪到空闲单元」已沉淀; 并定位出真正的失效是**检索**而非记录"
    the_technique: >
      ★规则 (用户 2026-10-30 总结): **把工作从瓶颈单元挪到空闲单元。**
      本案实例: 我们 cube 25.2% 而 CANN FA 70.1%, 同形状它快 1.7 倍 (F214);
      Laser 把 softmax 的重缩放与最终归一化都用**对角阵矩乘**搬给了 cube (F215)。
      ★配套前提两条: "搬"要看**接收方有余量**; "减"要看**契约允不允许**。两者下一步不同。
    where_it_lives: >
      ★**不是新建工具** —— `core/perf.py` 的 `_WORK_MOVES` 表早已存在, 且 2026-10-29
        就收了"行重缩放 -> 对角阵矩乘搬到 cube", 连 Laser 的行号都写全了。
      改动 (提交 ba28851):
        1. `push_work_moves()` 挂在 `profile_pipes` 末尾 —— **采样与看候选成为同一个动作**,
           并打出"最闲的通路"(搬的接收方);
        2. `--untried` 列出 `ours` 含"未试"的条目, 供任务简报**机械地**带上;
        3. 给"对角阵"那条补上 F214/F215 的实测依据。
      自检 5 条, 关键负例是"binding 不在表里时必须明说**本表没收**而不是沉默"。
    the_real_failure: >
      ★用户问"不是有全局台账吗"。答: **有, 而且这条正好在里面** —— 失效的不是记录, 是**检索**。
      两处都捕获到了而都没在决策时刻到达我:
        (1) `_WORK_MOVES` 是**拉取式**的, 只在"我已经想到要查"时起作用 —— 而那正是不需要它的时候;
        (2) `vc_l1l0_map.h` 的 `L1_DIAG_PING/PONG` 注释写着「Phase 3 预留: 对角阵与累加器驻留」,
