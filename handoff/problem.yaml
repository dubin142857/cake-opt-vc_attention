          先做数值探针, 不要推 —— `scripts/probe_vec_reduce.py` 有现成骨架。
      ★(b) **标量是 fp16**: qs 会被舍成 fp16 (10 位尾数)。与 fixpipe 的 trunc13 同量级,
          但要并进离线模型重算 (F234 的那套), 不能假定可忽略。
      ★(c) 尾部掩码值: 现行写 `-3.402823466e38f`, 在 fp16 里**不可表示**。
          chunkScore 转 fp16 后要换成 fp16 能表示的下界 (如 -65504), 且要核对
          `exp(qs*(mask - m))` 仍然下溢到 0。
      ★(d) "逐行填 `-qs*m`" 的实现与代价: 今天没有这一遍, 是新增的。
    next: >
