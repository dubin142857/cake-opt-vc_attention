      mindiesd 本机未装且 Laser 构建路径按登记表是断的; **CANN 的 FlashAttentionScore 可用**,
      故用它作同机同形状的参照。加了 `scripts/cannfa_runner.py` (提交 7256ecf)。
    setup: >
      卡 3, 形状 [B=1,H=28,S=37741,D=128] bfloat16, 两边都是 **24 AIC / 48 AIV 的 mix 内核**。
      CANN FA 端到端复现 143.9 / 146.8 / 147.3 ms (登记值 142), msprof 测得内核 139.5-140.2 ms。
      我们 HEAD 244400b: 基准 204.35 ms, msprof 窗口 202.3 ms。
    side_by_side: >
      各单元忙时占窗口 (我们 / CANN FA):
        **cube (矩阵)   25.2% / 70.1%**
        aic mte1        34.1% / 43.4%
        aic mte2        49.9% / 55.0%
        aic fixpipe     31.9% / **82.0%**
        aic scalar      49.0% / **97.9%**
        aiv vec         67.9% / 76.9%
        aiv scalar      59.0% / 41.8%
        aiv mte2        33.6% / 37.5%
        aiv mte3        16.6% / 37.0%
      全局流量 (GB, 我们 / FA):
        **GM->L1 (AIC 读) 297.6 / 158.4**
        L0C->GM (fixpipe)  186.0 / 167.2
        GM->UB (AIV 读)    186.6 / 185.9
        UB->GM (AIV 写)     74.9 /  92.9
    reading: >
      ★**CANN FA 几乎是矩阵受限的** (cube 70%, scalar 97.9%); 我们的 cube 只有 25%,
        算术下界 50.9 ms 而实耗 202.3。
      ★关键在 GM->L1: 我们的 K 是 int8(1B)、V 是 half(2B), 单位数据比它的 fp16 **还省 25%**,
        却读了 **1.88 倍** —— 只能是**重读次数**不同。按字节折算, 它的查询块约是我们的
        **2 倍 (128 行对 64 行)**。查询块翻倍则 K/V 重读减半, 且每条向量指令覆盖的数据翻倍。
      ★旁证: 把我们的 cube 时间按 int8 QK 比 fp16 快一倍拆开 (QK 17.0 + PV 33.9 = 50.9),
        则全 fp16 应为 67.9 ms, 与 FA 实测的 83.9 ms 同量级 —— 即 FA 的 cube 时间就是
        "全 fp16 该有的样子", 而它把这个量跑到了 70% 利用率。
    the_chain: >
      ★差距的因果链 (每一环都有本案的测量支撑):
        为削 fixpipe 流量而在 L0C 上按 **chunk 累加** (F191: 223.8 -> 186.0 GB)
          -> 整个 chunk 的 P 必须共用一个归一化基准, 逼出**两趟法** (F213 读到的内核注释)
          -> 第一趟的分数必须以 fp32 留在 UB, `scoreBuf = CHUNK*ROWS*N*4` 独占 **64 KB**
          -> UB 满 (160768 of 196608), **查询块只能是 64** (F203 算过 tile_m=128 装不下)
          -> K/V 重读次数是 FA 的 2 倍, 且每条向量指令只覆盖一半数据。
      ★**而这条链省下的 fixpipe, 我们 31.9%, FA 是 82.0% —— 它根本不在乎 fixpipe 跑满。**
        我们为一个不是瓶颈的单元, 付掉了真正的杠杆。
    corrects_F213: >
      ★F213 的判断**错在范围**: 我把"融合两趟"当成目的本身算账 (省约 3/10 条向量操作,
        换来握手 x4 与 L0C->GM +20%), 结论"不划算"。
      但真正的价值是**腾出 UB 把查询块加到 128** —— 这一点当时**根本没进我的账**。
      且握手的代价也被我高估: 查询块翻倍则任务数减半, 每核的 chunk 数随之减半,
