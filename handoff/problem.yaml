      ★Laser 的向量指令**全表** (一次发射一个核): VEXP 32 · VSUB 128 · VADD 96 · VMAX 96 ·
        VCADD 32 · VMULS 32 · VCMAX 32 · VCONV 66 · MOVEMASK 80 · BAR 716 ·
        MOV_UB_TO_UB 64 · VBRCB 64 · VDIV 2。**整个 softmax 就这些, 没有逐元素反量化链。**
    what_MOVEMASK_is_and_where_ours_come_from: >
      ★`MOVEMASK` 不做算术, 它设掩码寄存器。**每个带 `mask` 形参的 level-0 调用发一条。**
      我们的来源是遍布趟 1/趟 2 的这类写法:
        `for (off = 0; off < NB; off += 64) Sub(sc[off], sc[off], bmax, uint64_t(64), ROWS, rowBrc);`
        `Muls(..., uint64_t(64), ROWS, rp)` (反量化) · `WholeReduceSum(mass, sc, NB/2, ROWS, ...)`
