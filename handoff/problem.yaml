  - id: F137
    t: 2026-10-27
    severity: promotion
    claim: >
      **H26 晋升为新的已验收最佳版: expcast 328.46 -> 304.14 ms (**-7.44%**, 五闸全过含 G5),
      control 不可分辨。用位运算直接构造 E4M3 的解码值, 替掉 LUT 的 Gather。**
    build: {branch: h26-bitdecode, commit: 0979605, artifact: 4d20b857d25f3541,
            base: "9256a40 (h25, c6868a7ff87d726e)"}
    mechanism: >
      码 c = 8e + f 且 f < 8, 故 `c << 20` 本身就等于 `e<<23 | f<<20`; 再加常量 `120 << 23`
      (即 127-7 的指数偏置) 得到的 int32 按 fp32 读出, 恰好是 (1 + f/8) * 2^(e-7) ——
      与表里 e>=1 的 113 项**逐位相同**。CPU 上先验: 128 个码里只有 c<8 的 8 个不符。
      c<8 (E4M3 指数域为 0, 值 f/512) 由 CompareScalar + Select 单独处理。
      替掉的是 `Muls(raw,4)` + `Gather` (合计约 0.596 us/tile), 换上 6 条逐元素指令。
