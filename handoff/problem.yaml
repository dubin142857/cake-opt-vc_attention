      laser            74483  0.720 0.398  0.480  0.570  0.160   2.17    0.677 0.224       80.4
    finding_1_geometry_alone_regresses: >
      ★N=128 M=64 实测 **561952 us, 比基线慢 2.03 倍**, 且 fixpipe 流量**上升**到 297.4 GB。
