  - id: F222
    t: 2026-10-30
    kind: analysis
    title: "★★修正 F221 的方向: AIV 不是臃肿而是**没有余量**; 可取的 65 ms 在**重叠**上, 不在削向量指令上"
    trigger: "用户问: FA 算子为什么 aiv 占比这么高。查数据之后发现这个问法本身就把方向问对了。"
    aiv_is_not_anomalous: >
      ★高 AIV 占比对这类算子是**正常**的, CANN FA 比我们还高 (F214 同机对剖表):
        cube 25.2% / **70.1%** · aic fixpipe 31.9% / **82.0%** · aic scalar 49.0% / **97.9%**
        **aiv vec 67.9% / 76.9%** · aiv scalar 59.0% / 41.8%
      换绝对时间: FA 窗口 139.5-140.2 ms x 76.9% = **约 107.5 ms** 的向量;
                  我们 203.0 ms x 67.7% = **约 137.5 ms**。多 **28%**。
    the_28_percent_is_the_contract_not_waste: >
      ★这 28% 能逐条解释掉: 我们每个分数元素比纯 fp16 的 FA 多**两条整块向量操作** ——
        `Cast(int32->fp32)` (int8 矩乘的 int32 结果要转) 与按 K 量化块施加 scale 的 `Muls`。
        控制路径每元素约 7 条整块操作, 多的 2 条 = 2/7 = **28.6%**, 与实测的 28% 吻合。
      **即 AIV 的向量工作量没有水分, 它就是"FA 的 softmax + 我们的反量化"。**
    where_the_gap_actually_is: >
      ★我们窗口 203.0 ms, 而 AIV 向量本身只要 137.5 ms —— **65.5 ms 里向量流水是空的**;
        FA 那边同样的差只有 139.5 - 107.5 = **32 ms**。
      相位探针把这 65.5 ms 拆开 (稳态, 卡 3):
        `t1_setup` 占 AIV 每 chunk 的 **22.5%** = 22.5% x 203 ≈ **46 ms**
            内容: kscale 搬运 + 旗标 + 预取发射 + GetValue —— **标量与 DMA 的活, 向量空着**
        跨核等待 (`wait_s` + `wait_o`) 约 10% ≈ **20 ms**
        两者合计 66 ms, 与 65.5 ms 的缺口对上。
      ★基准 msprof 佐证: `aiv_scalar_time` 120208 us (59.2%), 其中 `aiv_scalar_vector_stall`
        64714 us —— 标量有 54% 的时间在等向量, 即**标量不是约束**; 而 AIV 各流水之和
        359 ms / 窗口 203 ms = 重叠度 1.77, 说明重叠在发生但不够。
    corrects_F221: >
      ★F221 的 next 写的是"先把 AIV 变便宜"。**这个说法要修正**:
        AIV 不是臃肿 (它只比 FA 多 28%, 且那 28% 全是反量化契约),
        而是**没有余量** (自身工作已占 87.2%, 往它加 11% 就翻转瓶颈 —— 这条 F221 测得没错)。
      **可取的量在重叠上**: 65 ms 的向量空转, 其中 46 ms 是 `t1_setup` 这段标量/DMA 活,
        它原则上应该与**上一块的向量计算**重叠, 现在没有。
    what_FA_does_differently: >
      ★FA 把每个单元都喂满 (cube 70% · fixpipe 82% · AIC scalar **97.9%** · aiv vec 77%);
        我们只有 AIV 一条在忙, 其余全部半闲。F208 一系已查明 FA 走 **KFC** 路径
        (AIV 把 matmul 请求投递给 AIC, 客户端/服务端) 且用 `IterateAll<false>` 异步,
        故它的 AIC scalar 能跑到 97.9%。我们是手写 cube + 跨核旗标, 两侧按 chunk 对拍。
    unconfirmed: >
      ★★**上面 `where_the_gap_actually_is` 对那 46 ms 的归因尚未坐实, 不要据此动手。**
        相位探针量的是**发射**时间, 它区分不了下面两种读法, 而两者的对策相反:
          (甲) 标量/DMA 在干活而向量空着 -> 对策是把这段挪进向量忙的时段 (加深 AIV 流水);
          (乙) 标量被**满的向量队列**堵住 -> 那向量并不空, 对策是减向量工作量。
        支持 (乙) 的现有数据: `aiv_scalar_vector_stall_time` 64714 us = 窗口的 **32%**。
      ★能区分两者的仪器是**流水时间线**。本轮采了 `--metrics TimelineDetail`, 产物是
        `visualize_data.bin` / `DeviceProf*.bin` 等二进制, 而 `core.perf --timeline` 要的是
        `trace.json` —— 中间缺一步 msprof 导出, 未打通。**打通它是下一步的前置。**
      ★这条记在这里是因为我在 `where_the_gap_actually_is` 里已经把 (甲) 写成了结论。
        按 F209 的教训, "只测一侧/只用一种仪器就断言谁在等谁"必然来回改口 —— 先补仪器。

    next: >
      ★目标改为: 把 `t1_setup` 的标量/DMA 活与上一块的向量计算重叠。
        动手前按 F219/F221 的前置检查回答三问: 这笔开销落到哪条流水 (AIV scalar/mte2)、
        那条流水还剩多少余量 (scalar 59.2% 且 54% 在等向量, 有余量)、
        它换走的是哪条流水的多少 (AIV vec 的空转 46 ms)。
      ★注意 F201 (减发射条数不可靠) 与 F203 (砍 vec_wait) 已关闭, 但它们动的是
        "少发指令"与"少等待"; 本条动的是**把已有的发射挪到向量忙的时候**, 是不同的手。

  - id: F223
    t: 2026-10-30
    kind: fact
    title: "★差分实验订正 F222 对那 46 ms 的读法 (标量在等向量, 不是向量空着)"
    SUPERSEDED_the_instrument_claim: >
      ★★**本条原标题里"本机拿不到核内逐流水时间线"是错的, 见 F224。**
        我只试了两条路 (真机 `msprof op --aic-metrics=TimelineDetail` 与模型级 msprof) 就下了结论,
        而正确的路是 **`msprof op simulator`** —— 文档明写 TimelineDetail "To enable this function,
        see Configurations of msprof op simulator"。本机 `$CANN/tools/simulator/Ascend910B2` **装了**。
        下面 `the_instrument_does_not_exist_here` 一段**作废**, 只保留它记录的那几条失败路径作参考。
      ★教训: "我试了两种办法没成" 与 "这台机器没有" 是两件事, 前者不该写成 kind: fact。
    the_instrument_does_not_exist_here: >
      ★`core.perf --timeline` 要 `trace.json`, 而本机两条采集路径都给不出核内逐流水的时间线:
        (1) `msprof op --aic-metrics=TimelineDetail`  -> 产物是 `visualize_data.bin` 与
            `DeviceProf*.bin`, **没有 CLI 解析器**; `msprof --export=on` 对 OPPROF 布局报
            "Can not find any host or device path"。`msprof op --help` 里 `--core-id` 一条
            自己写明 "only effective in simulation products"。
        (2) 模型级 `msprof --application=... --aic-metrics=TimelineDetail` -> **直接拒绝**:
            "invalid value:TimelineDetail. Please input in the range of
             [ArithmeticUtilization|PipeUtilization|Memory|MemoryL0|MemoryUB|L2Cache|
              ResourceConflictRatio|MemoryAccess]"。
            模型级采集本身可用, 但导出的 `mindstudio_profiler_output/msprof_*.json` 是
            **主机/API 级**时间线 (AscendCL 调用 · Node@launch · Computing), 核内看不见。
      ★**可用的仪器只有两类**: 聚合计数器 (PipeUtilization / ResourceConflictRatio / Memory*)
        与我们自己的 PhaseProbe (量的是**发射**时间)。两者都看不到"某条流水此刻是不是空着"。
      ★这一条解释了三次尝试为何停在同一处: F200 的"屏障导致 vec/scalar 串行"假说
        (被 F202 量化否掉, 一道屏障约 5 周期)、F204 的基址填充 (净额为零)、
        F222 对那 46 ms 的读法 —— 都需要这台仪器而它不存在。
    the_usable_method_is_differential: >
      ★替代手段: **差分实验** —— 只改一件事, 看哪几段相位动。本轮现成的一次:
        baseline 对 fp16 版 (后者在趟 1/趟 2 各多一条整块向量操作), 同形状同卡:
          `t1_setup`   48 -> **60** ticks
          `t2_publish` 12 -> **38** ticks
          `t1_vec`      8 ->   8   ticks  (纹丝不动)
        涨的两段恰恰是**含 V 同步旗标**的区间 (`WaitFlag<MTE2_V>` · `SetFlag/WaitFlag<V_MTE3>`
        · `MTE3_V`); 而纯发射的 `t1_vec` 不动 (PhaseProbe 量发射, 加指令不加发射时间)。
      ★**结论: 标量流是在这些旗标处等向量队列, 不是"向量空着而标量在干活"。**
    corrects_F222: >
      ★F222 的 `where_the_gap_actually_is` 把那 46 ms 判成"标量/DMA 在干活, 向量空着",
        并据此把方向定为"把 t1_setup 挪进向量忙的时段"。**按上面的差分实验, 这个读法要订正**:
        `t1_setup` 是标量**等向量**的地方, 把它挪位置不会产生收益。
      ★仍未解释的是: 若向量真是约束, `aiv_vec` 该接近 100%, 实测只有 67.7%
        (`aiv_vec_wait_ratio` 0.24 —— 向量单元自身也有 24% 在等)。
        在拿不到时间线的前提下, 这一步只能靠差分实验逐个排除, 不能靠读数直接断言。
    next_candidate_with_preconditions_answered: >
      ★下一个候选: **把两侧的错位由 1 个 chunk 加深到 2 个**。按 F219/F221 的前置三问:
        (1) 开销落在哪: workspace 的 S/P 槽由 `2*CHUNK` 增到 `3*CHUNK` (+131072 B/核),
            **不增加任何 GM 流量** —— 只是多一组槽位;
        (2) 那一侧还剩多少余量: workspace 现 448 KB/核, 加后 576 KB/核, 设备侧无压力;
        (3) 它换走的是哪条流水的多少: AIV 的 `wait_s` (稳态占 AIV 每 chunk 的 **9.4%**)
            与 `wait_o`; 而 AIC **从不等待** (实测 0.0%), 故让它跑得更靠前对它是免费的。
        上界 = AIV 的跨核等待约 10% = **约 20 ms**。
      ★这正是 F123 从 CANN FA 调度表读出的那一条的我方对应物: FA 用 `info[taskId % 3]`
        做**三级深**的跨 task 流水, 我们现在只有一级。
      ★**未决的前置**: 加深错位只在"AIC 有富余吞吐、只是缓冲不够所以跑不开"时才有收益。
        而实测 AIC 自身工作已占 100% (从不等待) —— 若它根本不比 AIV 快, 那 AIV 等的
        就不是缓冲而是 AIC 的产能, 加槽位无用。两侧的每 chunk 合计 (AIC 1.35 us / AIV 2.29 us)
        **至今对不上** (F209 登记的读数缺陷), 不能用它来判这件事。
        故动手前要先用**差分实验**确认: 例如把 CHUNK 由 4 降到 2 (AIC 每 chunk 的活减半、
        发布频次翻倍), 看 AIV 的 `wait_s` 是降还是不动 —— 降则是缓冲问题, 不动则是产能问题。
      ★结构代价也要记: 现行 `pc = c - 1` 与 `if (c == 0) continue` 把一级错位写死在循环里,
        改两级要同时动循环边界与四个跨核旗标的收支, 不是只加槽位 (NSLOT 与 WorkspaceBytesV2 两处)。

  - id: F224
    t: 2026-10-30
    kind: fact
    title: "★★订正 F223: 核内指令流水图**拿得到** —— 走 `msprof op simulator`, 本机已装 Ascend910B2 模拟器"
    corrects_F223: >
      ★F223 把"我试了两条路没成"写成了 kind: fact 的"本机没有"。**那是错的。**
        正确的路是 `msprof op simulator`: 真机 `msprof op --aic-metrics=TimelineDetail` 的文档
        自己写着 "To enable this function, see **Configurations of msprof op simulator**" ——
        指令流水图与代码热点图的数据源是**模拟器**, 不是真机采样。
      ★教训 (比这条事实本身更重要): **"我试了两种办法没成" 与 "这台机器没有" 是两件事。**
        前者不该写成 fact。下结论前先把工具自己的 --help 与文档读完 (本机 `msprof op simulator --help`
        一直就在, 我第一轮只敲了 `msprof op --help`)。
    what_exists_locally: >
      ★`$CANN/tools/simulator/` 下有 **Ascend910B2**(含 conf 与 lib), 以及 910A/910B1/910B3/910B4 等。
      ★`$CANN/tools/` 下还有此前没找到的 **msobjdump**(Ascend C ELF 反汇编) 与
        **ccec_compiler/bin/**(bisheng · ccec · llvm-objdump 等) —— 我第一轮只找了 `$CANN/compiler/`,
        找错了目录。
    how_to_use: >
      ★取指令流水 (本轮实跑, 已进到我们的内核):
        msprof op simulator \
          --application="python3 scripts/msprof_runner.py --device 3 --queries 64 --keys 4096 --heads 1 --launches 1" \
          --kernel-name=vc910_forward_m64 --aic-metrics=PipeUtilization \
          --soc-version=Ascend910B2 --core-id=0 --output=<dir> --launch-count=1 --timeout=20
      ★两个档位各给什么 (文档原文):
        `PipeUtilization`        计算与搬运的**指令流水**;
        `ResourceConflictRatio`  **SET_FLAG / WAIT_FLAG 指令的明细** —— 正是我们要看的旗标等待。
        两者在 simulator 模式下**默认都采**; 但若显式只写 PipeUtilization, ResourceConflictRatio 会被关掉。
        **所以要同步细节必须写 `--aic-metrics=PipeUtilization,ResourceConflictRatio`。**
        `PMSampling` 另给内存通道吞吐波形, 且 `--core-id` 对它不生效 (它解析所有核)。
      ★另外两条入口 (都不必跑应用):
        `--config <*.o>`   直接剖算子二进制 (需 JSON 配置描述输入; 要用 LD_LIBRARY_PATH 指定模拟器);
        `--export <目录>`  直接解析已有的 simulator dump; 目录里放一个名为 **aicore_binary.o**
                           的内核二进制才会有代码行映射。
      ★真机已编好的算子想在模拟器上跑而不重编: 把 `libruntime_camodel.so` 软链成 `libruntime.so`
        放进 `LD_LIBRARY_PATH`。
      ★`--timeout=<分钟>` 到点强杀并解析**部分**数据, 文档明说这是预期用法 ("Necessary information
        can be obtained from some pipeline graphs") —— 周期级模拟很慢, 必须用小形状 + timeout。
    the_minus_g_option: >
      ★模拟器与 `Source` 两处都要求 `-g`:
        simulator 报 "Kernel missed debug_line information. If you need code call stack,
                      please recompile kernel with -g option";
        真机 `--aic-metrics=Source` 报 "Hot spot function calculate data failed" / 
                      "Generate hot spot function failed"。
      ★本仓已加开关 (默认 OFF, 生产构建指纹不变):
        `ascend/CMakeLists.txt` 的 `option(VC_KERNEL_DEBUG_LINE ...)` -> `ascendc_compile_options(vc910_kernel PRIVATE -g)`;
        `ascend/setup.py` 从环境变量 `VC_KERNEL_DEBUG_LINE` 取值。
        CANN 的 `asc_modules/FindASC.cmake:96-117` 把 `ascendc_compile_options` 的内容包进
        `-Xaicore-start ... -Xaicore-end`, 即只给内核侧编译器, 不动 host 侧。
      ★**取剖面的构建不可用于交付** —— 打开它产物指纹会变。
    what_real_hardware_still_gives: >
      ★真机 `msprof op --aic-metrics=Source` 虽然热点图算失败, 但 dump 里留下了**可直接读的文本**:
        `dump/fdata`                  —— 逐基本块的**执行计数** (全核合计)
        `dump/kernel0Stub.o.bbbmap.0` —— 基本块映射 (function / start addr / BBB id + Offset)
        `dump/kernel0.extra.0`        —— **逐核**的块计数 (与 fdata 的比值恒为 23.98 ≈ 24 核, 已核对)
      计数可自校验: AIC 的 0x300 块 = 16520 = 任务数 (590x28); 0x3d8 = 1222480 = 16520x74 (每任务 74 chunk);
        0x4f8 = 4873400 ≈ 再x4 (chunk 内 4 块)。**结构完全可解。**
      ★`visualize_data.bin` 也不是黑盒: 它是 **u64 长度 + u16 类型 + 'ZZ' 魔数 + JSON** 的记录流,
        本轮已写出解析器读通 (真机那份里 `mix_block_detail.row` / `subblock_detail` 等为空, 
        因为那些字段本就要模拟器才填)。
    next: "等本轮 simulator 跑完, 解析 PipeUtilization 的流水数据, 回答 F222/F223 那个未决问题: AIV 的向量流水到底空在哪。"

