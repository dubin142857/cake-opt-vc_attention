  - id: F217
    t: 2026-10-30
    kind: result
    title: "★更正 F215 并定出设计: Laser 的重标定是**每 section 一次**(不是每块); 真正的差别是 **O 累加器不在 AIV 手里**"
    corrects_F215: >
      ★F215 写的"一趟在线 softmax, 逐 128x128 块"**是错的**。读完调用点才看清:
        `CubeForward.h:197` `if (!src[idx].onStartSection) diag_matmul(result_gm, curr_rowmax, 2, false);`
        `CubeForward.h:343` `if (src[idx].onEndSection) diag_matmul(src[idx].out, curr_rowsum, ky, true);`
      而遍历键块的是内层 `for (i = 0; i < Kx; i++)` —— 其中**没有** diag_matmul。
      即 Laser 同样把若干键块批在一个归一化基准下 (它叫 section), 与我们的 chunk **同构**;
      重标定只发生在 section 之间。★"换基准的频次"不是差别所在。
    the_actual_difference: >
      ★差别在**谁持有 O 累加器**。
      - Laser: O 在 **GM/L0C**, 归 AIC。section 开头 `matmul_fp32` 把 O 从 GM 读回 L1->L0B,
        与 L0A 上的对角阵做 **fp32 128^3 矩乘**, 结果落 L0C; 随后该 section 的 PV 直接在
        L0C 上累加; section 末用 rowsum 对角阵再乘一次并 `copy_out`。
        AIV 侧只有 `buf_for_load_O_fp32` ("装载计算好的O") —— **只读最终结果, 从不累加**。
      - 我们: O 累加器 `accBuf` 在 **AIV 的 UB**, 每 chunk 做 `Brcb(alpha)` + `Mul(acc,acc,balpha)`
        + `Add(acc,acc,pv)`, 任务末再逐行 `Muls(1/l)` 与 `Mul(vscale)` (各 ROWS 次窄调用)。
      ★另一处: Laser 的分数是 `pp_buf_for_attn_score_fp16[2]` —— **fp16 的单块 ping/pong**;
        我们是整 chunk 的 fp32 `scoreBuf` (64 KB)。
    why_it_unlocks_128: >
      ★把 O 搬走能腾出 `accBuf` + `pvBuf` = 2 x ROWS x MAX_D x 4。
      tile_m=128 (ROWS=64) 时的 UB 账 (单块窗口):
        score 32768 + raw 2槽 65536 + p 16384 + **acc 32768 + pv 32768** + sub 32768
        + vs 512 + state 3072 + lut 512 + cmp 1024 + brcb 4096 = 222208 > 196608 (超 25600)
        **去掉 acc 与 pv 之后 = 156672, 余 39936** —— 装得下。
      ★而 tile_m=128 **必须**先去掉 chunk 的 `scoreBuf` (ROWS=64 时它要 131072, 占 UB 的 2/3),
        而去掉 chunk 窗口又**必须**先把 O 的重标定搬走 (chunk 窗口存在的理由就是让 L0C 能连续累加)。
        **三者是一条强制的链, 次序不能换。**
    api_checked: >
      ★教训二: `asc_mmad(__cc__ float*, __ca__ float*, __cb__ float*, ...)` **在公开 API 里存在**
        (`c_api/cube_compute/cube_compute.h:66-67`), 不必像 Laser 那样用裸内建。
        平台 `[AICoreintrinsicDtypeMap]` 的 `Intrinsic_mmad` 含 **`f32f32f32`**
        (注意 `[CUBECoreintrinsicDtypeMap]` 不含 —— 我们是 mix 内核跑在 AICore 上, 适用)。
      ★对角阵的构造 (`VectorForward.h:1348 form_diagmat`) 是**标量循环**直写 UB 的对角元,
        再 `copy_ubuf_to_gm`, 并按 `step` 摊开与别的活重叠 —— 代价不大。
    expected_gain_per_step: >
      ★诚实的分步预期 (避免把最终收益记到第一步头上):
        步骤 2 (O 重标定搬 cube) 本身: 砍掉 AIV 的 `chunk_tail` 7.3% + `pv_work` 4.4% ≈ 11.7%
          of 2.21us = 0.26 us/chunk, 对每 chunk 窗口 ~3.97us 即 **约 6%**;
          代价是 AIC 每 chunk 多读 O (MT*dim*4 = 32KB) 与对角阵 (MT*MT*4 = 16KB) ——
          `GM_to_L1` 约 +60 GB (297.6 -> ~358, +20%), 而 `aic_mte2` 现为 49.9%。
        步骤 3+4 (单块窗口 + tile_m=128) 才是大头: K/V 重读减半 (297.6 -> ~190 GB),
          向量指令宽度翻倍。
      ★**步骤 2 的价值主要不在它自己的 6%, 而在它解锁步骤 3/4** (F213 的教训: 评估改动要把
        它解锁的下游一起算)。
    next: "按 F215 的次序实施; 步骤 2 的 E30 已写定。"

  - id: F218
    t: 2026-10-30
    kind: result
    title: "★★7 号卡被污染而 devguard 判它可信: 本轮三次「回归」全部是卡, 不是代码"
    what_happened: >
      步骤 2 的内核改完后在 7 号卡上连跑三次 141 例验收, 分别停在
      `q=33 k=129 d=64 expcast=True` (rmse 0.704)、`q=65 k=257 d=64 expcast=False` (rmse 0.0794)、
      同一例同一数值。我据此判定"本次改动引入了确定性回归", 并花了相当篇幅去找成因 ——
      包括把 b8b52c9 删掉的那道 `PipeBarrier<PIPE_V>` 加回来做对照 (无效)。
    the_measurement_that_settled_it: >
      ★把改动 `git stash` 掉、用**改动前**的构建跑同一个 40 次交替脚本:
        **同样失败 7/40, 坏值逐位相同 (比值 93.9615707397461 / 260.6604919433594 /
        265.41888427734375 / 209.40846252441406)**。即缺陷与本次改动无关。
      ★再把同一脚本搬到别的卡:
        卡 3 -> 0/40 · 卡 4 -> 0/40 · 卡 7 -> 6/40 (且坏 head 在 0 与 1 之间漂移)。
      **而卡 3、卡 4、卡 7 三张卡都通过了 `core.devguard --verify-artifact vc910_card_clean`。**
    defect_shape: >
      形态 (卡 7): 整个任务的输出被**一个逐行标量**乘错, 方向保持 ——
        与正确结果的余弦 0.9994, 模比 266 (或其倒数 0.00376)。
        `chunks=1` 的形状上 `l` 恰等于 `massAcc`, 故这一标量就是行和。
      触发条件: 需要**交替切换 expcast** 的连续启动 (同参数连跑 60 次不复现);
        约 15% 的启动命中; 命中时坏值确定。
    why_the_guard_missed_it: >
      ★`vc910_card_clean` 探针只跑**一次**已知产物并核对一个结论。本缺陷要
      "交替切换参数的多次启动 + 约 15% 的命中率"才显形, 单次复现必然放行。
      这是 F208 那条教训的再次实例, 但对象换成了**卡的体检本身**:
      守卫只能保证"它查过的那条结论在这张卡上成立", 不能保证"这张卡可信"。
    corrections: >
      ★卡的名册更正: 干净 = **3 · 4**; 污染 = 2 · 5 · 6 · **7**; 1 号卡 Alarm; 0 号卡禁用。
        简报里"干净卡 3 · 4 · 7"这一条自本条起作废。
      ★本轮此前所有在 7 号卡上得到的数值判决一律作废。
    lesson: >
      ★**"同一构建换一张卡"要排在"同一卡换一个构建"前面** —— 后者要一次完整构建 (约 4 分钟),
        前者零成本。本轮把次序弄反了, 代价是在错误前提上做了两轮推演与一次对照构建。
      ★★**一条守卫说"可信"不等于可信, 只等于"它查的那条过了"。** 判决反常时, 先问
        "这条守卫查的是不是正是现在要信的那件事", 再去改代码。
    sediment: "下一条: 把本交替复现升成 core/devguard 的探针, 否则同样的误判会再来一次。"

  - id: F219
    t: 2026-10-30
    kind: result
    title: "★★E30 被证伪: O 的重标定搬到 cube 使固定核心 204.35 -> 221.68 ms (**劣化 8.5%**), 已回退"
    change: >
      按 F217 的设计实施步骤 2: AIC 每 chunk 先做 `L0C_ACC = diag(alpha) x O_run` 的
      fp32 对角阵乘 (`resc_gm2l1` / `resc_l12l0` / `resc_mad`), 随后本 chunk 的 PV 以
      `Init=false` 累加其上; AIV 删掉 `DataCopy(pv)` + `Brcb` + `Mul` + `Add`, 改为
      任务尾从 GM 读一次最终 O。workspace: O 由双槽改单槽, 省出的字节给 D 的双槽 (D=128 时总量不变)。
    e30_closeout: >
      ★E30 写于动手前, 原文未改。四条里**三条成立, 结论那条被证伪**:
        AIV `pv_work`  预测下降        -> 4.4% -> **0.0%**          成立
        `aic_cube` 占比 预测上升        -> 25.2% -> **30.8%**        成立
        `GM_to_L1`     预测 +20%       -> 297.6 -> **352.8 GB (+18.5%)**  成立
        `L0C_to_GM`    预测基本不变     -> 186.0 -> **186.0 GB (±0%)**     成立
        **fixed core   预测下降约 6%   -> 204.35 -> 221.68 ms (+8.5%)  ✗ 证伪**
      数值无碍: 141 例通过 (卡 3), dense RMSE 2.979997% (原 2.979952%),
      determinism_sweep 5/5 逐位一致 (摘要五条全变, 与"累加顺序由 AIV 的 fp32 加法改到 L0C" 一致)。
    mechanism: >
      ★相位探针 (卡 3, 稳态 key=25088) 把成因指死:
        AIC 每 chunk 1.56 us 里 `resc` 只占 **2 ticks = 0.022 us = 1.4%** ——
        **对角阵乘本身几乎不要钱**; 涨的是 `chunk_drain` (47.8%, 真排空) 与 `aic_mte2`
        (49.9% -> **53.0%**)。即代价不在 mad 的周期, 而在它**要求的搬运**:
        每 chunk 多读 D (MT*MT*4 = 16 KB) + O (MT*dim*4 = 32 KB) = 48 KB,
        对本就 256 KB/chunk 的基数就是 +18.75%, 与实测 +18.5% 吻合。
    the_premise_that_was_wrong: >
      ★F217 的前提"cube 利用率只有 25.2%, 把活挪到闲着的单元"把两件事混为一谈:
        **闲的是 mmad 单元** (cube_ratio 25.2%), **忙的是 AIC 这个核** ——
        它的 MTE2 占窗口 49.9%, 且 F209 早已实测 AIC 是关键路径、几乎从不等待。
        我们搬过去的活, 其代价**主要落在 AIC 的 MTE2/MTE1 上, 不是 mmad 上**。
      ★同时 AIV 并不是瓶颈 (稳态它等 AIC 18.0%), 所以砍掉它 4.4% 的 `pv_work` 换不回任何墙钟。
    chain_reexamined: >
      ★F217 说"步骤 2 -> 3 -> 4 是一条强制的链", 复核后**不成立**:
        - 步骤 3 (单块在线窗口) **不需要**步骤 2: 单块窗口只是把 F191 之前
          "AIV 每 tile 做 acc = acc*alpha + pv"恢复回来, 那个设计本来就跑得通;
          它的真实代价是 O 的 fixpipe 频次 (vc_l1l0_map.h 的 CHUNK 表: CHUNK=1 -> 297.4 GB)。
        - 步骤 2 **没有**腾出 UB: `accBuf` 仍要留着当任务尾读回 O 的落脚处
          (要连最终归一化也搬到 cube 才能去掉), 而 `pvBuf` 改成 `diagBuf` 是字节中性的。
        - ★**对角阵是 tile_m x tile_m, 随 tile_m 平方增长**: tile_m=128 时 D 要 64 KB UB
          与每 chunk 64 KB 的 GM 读。即这个手法**随着我们想走的方向变贵**, 不是变便宜。
      故步骤 2 作为"解锁下游"的前置不成立, 它只剩自己那 -8.5%。
    decision: >
      ★**回退内核接线** (提交 70242e4 之前的状态 = 8faea1f + 仅 claim_l0c 探针标记)。
      回归确认: fixed core **204.3496 ms** · dense RMSE **2.979952%** · 141 例通过, 与回退前记录逐位一致。
      ★`resc_gm2l1` / `resc_l12l0` / `resc_mad` 三条原语与其数值探针**保留** (8faea1f):
        它们已被逐位坐实, 生产路径不调用, 零开销; 将来若在别的几何下重新评估可直接复用。
    lessons: >
      ★**"某个单元空闲"要先问清是哪一级的单元。** cube_ratio 量的是 mmad 单元,
        而把活挪过去的开销通常落在同一个核的搬运流水上。判一个"挪工作量"的手法之前,
        先把它**要求的搬运**算出来, 和目标流水当前的占用比一比。
      ★**解锁论证要能独立检验。** F217 说步骤 2 是 3/4 的前置, 复核后三条理由
        (UB、窗口、链条) 没有一条成立。"它本身亏, 但解锁了下游"这种说法必须当场把
        下游的账也算出来, 否则就是把亏损挂账到一个不存在的未来收益上。
      ★E10 那条分法 (流量与重叠分开记) 这次直接给出了结论: 三条流量/占比预测全中,
        只有墙钟反了 —— 说明模型对"发生了什么"是对的, 对"值不值"是错的。
    next: >
      ★步骤 3/4 的前置已不成立, 不再按 F215/F217 的次序往下走。
      当前真实站位未变: 204.35 ms · AIC 是关键路径 · aic_mte2 占窗口 49.9% ·
      `GM_to_L1` 297.6 GB 对 CANN FA 的 158.4 GB。减 AIC 读字节仍是方向, 但手段要另选。

  - id: F220
    t: 2026-10-30
    kind: analysis
    title: "★tile_m=128 的 UB 预算算通了: 189440 <= 196608 (余 7168); 唯一的契约代价是分数暂存转 fp16, 已离线量出 +0.00037 个百分点"
    method: "不动内核。读完 RunVector 里每块缓冲的真实用法, 把预算逐项摊开; 两项代价用离线 oracle 量, 一项常数用独立的 host 小程序查。"
    not_ub_constraints: >
      ★先排除非 UB 的约束 (MBLK=128 代入 vc_l1l0_map.h 的公式):
        staged_l0a = 2*max(128*128*1, 128*128*2) = 65536 = L0A_SIZE   正好装满
        staged_l0b = 2*max(128*128*1, 128*128*2) = 65536 = L0B_SIZE   正好装满
        staged_l0c = 2*max(128*128*4, 128*128*4) = 131072 = L0C_SIZE  正好装满
        L1: Q 常驻 128*128 = 16384 · PV 的 P 片 128*128*2 = 32768, 均 < 65536
      三条 static_assert 都是 `<=`, 故零余量但**合法**。**拦路的确实只有 UB。**
    budget_now: >
      现行布局在 ROWS = tile_m/2 = 64 (N=128, MAX_D=128, CHUNK=4) 上:
        rawBuf 2槽      65536   趟 1 的 int32 S 落地, 双缓冲供预取重叠; 趟 2 的 expcast 用槽 0 当暂存
        scoreBuf 4槽    131072  整 chunk 的 fp32 分数 (两趟法要留着)
        pBuf             16384  一块 half P
        accBuf           32768  O 累加器 (跨任务存活)
        pvBuf            32768  每 chunk 读回的 O
        subBuf           32768  expcast 的 e0val
        cmpBuf            1024  expcast 的掩码
        vs+state+lut+brcb 8192
        tmpBuf           16384  ★独立查得 (见下)
        合计            336896   上限 196608, **超 140288**
    reduce_bytes_measured: >
      ★`reduce_bytes` 此前只知道"运行时由 GetReduceSumMaxMinTmpSize 定", 数值从未记过。
      用独立 host 小程序直接查 (链 tiling_api/platform/graph/graph_base/unified_dlog):
        tile_m=64  -> shape{32,128} -> max_tmp=sum_tmp=8192  -> reduce_bytes = **8192**
        tile_m=128 -> shape{64,128} -> max_tmp=sum_tmp=16384 -> reduce_bytes = **16384**
      即 ROWS*N*2, 随行数线性。**比一次内核构建 (4 分钟) 便宜两个数量级。**
    the_measures: >
      ★四项, 每项都有独立判据, 按 F189 分开测:
        (1) scoreBuf fp32 -> fp16          -65536  契约变更, 代价已离线量出 (见下)
        (2) pvBuf 并入 rawBuf 槽 0         -32768  两者用时不相交: pv 读在消费段, 趟 2 已用完 raw
        (3) subBuf 去掉, e0val 复用 sc     -32768  `Cast(raw, sc, CAST_RINT)` 之后 sc 即死, 可当 e0val
        (4) pBuf 并入 rawBuf 槽 1          -16384  ph 的 MTE3 排空已有 MTE3_V 旗标守着
      改完后 ROWS=64:
        rawBuf 65536 + scoreBuf(fp16) 65536 + accBuf 32768 + cmpBuf 1024 + 小件 8192 + tmpBuf 16384
        = **189440 <= 196608, 余 7168**。
      ★rawBuf 两槽在三个时段分别承担三件事 (趟 1 的 S 落地双缓冲 · 趟 2 的 fp32 工作块与
        expcast 的 int32 暂存 · 消费段的 O 读回), 时段互不相交。
    fp16_score_cost_measured: >
      ★给 `payload_reference` 加了 `score_dtype` 旋钮 (默认 None = 现行, 行为逐位不变),
        在交付形状上离线量 (卡 3, 32 行查询, 与 benchmark 同 seed):
          control chunk窗口 fp32  dense RMSE 2.975507 %  -> fp16 **2.975880 %  (+0.000374 pp)**
          expcast chunk窗口 fp32  dense RMSE 4.360672 %  -> fp16 **4.361099 %  (+0.000427 pp)**
        即比 2.98% 的量级小**三个数量级**。
      ★★但 141 例闸比的是**内核对 oracle**, 不是对 dense。直接量这一差:
          control: 全局相对 RMSE 0.055 % · 逐行最坏 0.093 %   (1% 闸内)
          expcast: 全局相对 RMSE 0.814 % · **逐行最坏 1.816 % —— 打穿 1% 闸**
        成因: expcast 把 shifted 分数映成 E4M3 的**整数码**, 分数的一点扰动会把码翻 ±1,
        而一档就是 2^(1/8) ≈ 9% 的解码值跳变 —— 量化把小扰动放大成台阶。
      ★结论: oracle **必须同步改契约** (传 score_dtype), 与当年 `tile_width` 同理 ——
        payload_reference 的定位本就是"内核的同契约 oracle"。届时 decoded_reference 回到 ~1e-8,
        真实代价只体现在 dense RMSE 的 +0.0004 pp 上。**这是契约变更, 不是闸放宽, 但必须留痕。**
    the_downstream_is_computed_not_asserted: >
      ★F219 的教训要求: "解锁下游"必须当场把下游的账算出来。算了:
        AIC 每 head 的读字节模型 (qpad=kpad=37760, d=128, 28 heads):
          K  int8  : kpad*d   * (qpad/tile_m)
          V  half  : kpad*d*2 * (qpad/tile_m)
          P  half  : qpad*kpad*2            (与 tile_m 无关)
        tile_m=64  -> 2.851e9 + 5.703e9 + 2.852e9 = 1.141e10 B/head; x28 = **297.6 GB**
          —— 与 msprof 实测的 297.6 GB **三位有效数字吻合**, 模型可信。
        tile_m=128 -> 1.426e9 + 2.851e9 + 2.852e9 = 7.129e9 B/head; x28 = **185.9 GB (-37.5%)**
          (CANN FA 同形状是 158.4 GB。)
        而 O 的 fixpipe 字节比 = 4/CHUNK, 取 CHUNK=4 时恰为 1, 即 `L0C_to_GM` **不变**。
      ★若 AIC 的 MTE2 是关键路径上的主导流水 (现占窗口 49.9%), 机制的上界是
        204.35 x (1 - 0.375*0.499) ≈ 166 ms。**这是机制上界, 不是预测。**
    open_interface_question: >
      ★动手前要先读本机头文件确证 (教训二): 趟 1 的行最大值必须取在**取整之后**
        (否则 fp16 可能向上取整越过基准, ExpCast 那条"上界永不触到"的不变式失效,
        内核据此删掉的 Mins(sc,120) 就要加回来)。两条路线:
          (a) 存 fp16 后再 Cast 回 fp32 工作块求 ReduceMax —— 每块多两次整块 Cast;
          (b) 直接对 fp16 存做 ReduceMax 再把标量 Cast 成 fp32 —— 需确认
              `ReduceMax<half, Pattern::AR>` 在本机的存在性与它的 tmp 尺寸契约
              (`GetReduceMaxMaxMinTmpSize(shape, ge::DT_FLOAT16, ...)` 的返回值)。
        max 是保序的, 故两条在数值上等价; 选哪条看 (b) 是否可用。
    e31: >
      ★E31 (增量 1 = scoreBuf fp32 -> fp16, 在 **tile_m=64** 上单独测, oracle 同步改契约;
        写于动手前, 届时照抄原文不改):

        `GM_to_L1`   预测**不变** 297.6 GB (容差 2%) —— 改的是 AIV 的 UB, 与 AIC 的 L1 搬运无关
        `L0C_to_GM`  预测**不变** 186.0 GB (容差 2%)
        `aiv_vec_time` 与 msprof 的 "UB 冲突折算时间" (现 21178.9 us, 其中 bankgroup 10209.2)
                     预测**下降** —— scoreBuf 的读写字节减半
        fixed core   预测**不劣于** 204.35 ms; 本步目的是腾 UB 不是提速, 落在 +-1% 内即算成立
        dense RMSE control  2.979952 % -> 预测 **+0.00037 pp** (约 2.98032 %), 容差 +-0.0002
        dense RMSE expcast  4.363075 % -> 预测 **+0.00043 pp**
        141 例      必须仍 passed; `decoded_reference` 的量级应回到 ~1e-8 (oracle 同步改契约)
        `VectorBytes(8192, 64, 4)` 预测由 **168960 降到 136192**
    next: "实施增量 1。先把上面那条接口问题读清楚, 再动手。"

  - id: F221
    t: 2026-10-30
    kind: result
    title: "★★E31 被证伪: 分数暂存转 fp16 使固定核心 204.35 -> 229.52 ms (**劣化 12.3%**), 且**瓶颈换边**到 AIV; 已回退"
