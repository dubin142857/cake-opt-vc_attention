# VC-Attention / Ascend 910B2 问题台账
# 约定: cake-toolkit cases/<op>/problem.yaml (复现契约 + 验收 gate + 假设)
# 循环: KDA draft -> plan -> candidate -> validate -> measure -> promote
# 字段 kind/to/evidence/hypothesis 与 core/statemap 的记录格式保持一致

op: vc_attention
kind: performance            # 首要诉求是性能, 但精度是前置硬 gate
status: open                 # 本机尚无任何一次成功构建或测量
opened: 2026-10-23

# ---------------------------------------------------------------- 问题定义
problem:
  one_line: >
    VC-Attention 在本机 Ascend 910B2 上尚未建立可复现的构建与测量基线;
    对端(A3/910_9382)已有的稳定 Laser 结果无法直接搬用, 因为本机缺少其构建清单与二进制。
  upstream_contract: PF_better/topics/VC_ATTENTION_ASCEND/codex-pc/REQUIREMENTS.md
  target_workload:
    dtype: bf16
    layout: [BNSD, HND]
    main_shape: [1, 28, 37741, 128]
    also_cover: [fp16, D64, 短序列, 尾块, 全零输入, K4096 分段边界, 变动最大值, payload 复用]
    caveat: >
      主形状是合成形状。真实视频模型的 post-RoPE Q/K/V 分布、层与去噪步分布尚未采样,
      不能把该形状当作全部需求。

# ---------------------------------------------------------------- 约束
constraints:
  hard:
    - id: C1
      text: 禁止修改 CANN 安装包源码 (/usr/local/Ascend/...), 与同事共用。
      from: cake-toolkit/README.md 硬约束 1
    - id: C2
      text: 禁止重启主机、Docker/容器运行时、公共环境或他人容器; 不删他人镜像/容器/文件; 不变更公共依赖与服务。
      from: REQUIREMENTS.md 共用机器约束
    - id: C3
      text: 只使用当时空闲的 NPU; 每次运行前检查占用, 不把过去的空闲当作现在的授权。
      from: REQUIREMENTS.md 共用机器约束
    - id: C4
      text: 不把源码仓、构建产物、模型权重或海量原始 trace 复制进 PF_better; PF_better 只同步文档、测量结论与仓库地址。
      from: REQUIREMENTS.md 同步约束
    - id: C4b
      text: >
        Gitee 的 vc-attention 是**甲方仓库**。禁止推送任何改动到该仓库, 包括候选分支。
        本侧改动只留在本地分支, 经 PF_better 以文档形式告知对端, 由对方决定是否采纳。
      from: 用户指示 2026-10-26
      history: >
        2026-10-26 用户一度要求在 Gitee 开分支/PR 交付, 随后即撤回 ("还是老规矩")。
        期间实际发生的事: 本地备好了交付分支与文档, 执行 git push 被环境拦下
        (SSH 认证通过, 但写操作被本地层拒绝, 错误前缀 [session-...] 非 Gitee 格式),
        故**甲方仓未被改动** —— 事后核对 ls-remote 仍只有 master 且停在 9e3a550。
        交付改走 PF_better 的补丁与文档, 与本约束一致。
    - id: C5
      text: 只在 topics/VC_ATTENTION_ASCEND/<peer>/ 下写自己那一份, 经 git pf send/inbox/show/ack 同步。
      from: REQUIREMENTS.md 同步约束
    - id: C6
      text: >
        **任何性能或正确性结论必须声明其所在的语义层级**, 不得省略:
          v1   = 甲方 910B 端口现状 —— INT8 QK (含 K 去均值) + ExpCast + 每通道整序列单 scale 的 E4M3 V;
                 无 Q/K Hadamard, 无 V-Smooth, 无 causal (api.py:146 自己抛 NotImplementedError)
          v2   = v1 + V-Smooth (128 块内去均值 + 块/通道 E4M3 残差 + FP16 mu/scale 在线恢复 + K/V 同序排列)
          full = v2 + Q/K 共同归一化 Hadamard + causal + 去噪调度
        "VC-Attention 在 910B 上快了 X%" 这种不带层级的表述一律视为错误表述。
        理由见 F57/F58: payload_reference 是 v1 子集的 oracle, 与它逐位一致不等于与论文一致。
      from: 用户质询 2026-10-26 + PAPER_ALIGNMENT.md
  measurement:
    - id: M1
      text: 预处理 / 固定 payload 的原生核心调用 / 完整 API 三者分开计时, 完整 API 每次含预处理。
    - id: M2
      text: 同设备、同输入、同数值契约、同进程交错配对比较; 保留原始 JSON/log、SoC/CANN/torch_npu、源码 commit、产物哈希。
    - id: M3
      text: 只在正确性通过后比较速度。不同 SoC 或不同算法的时间只能作背景, 不得相除得加速比。
    - id: M4
      text: 收敛只认端到端测量; 未 PASS 前只写"假设", 不写"已定位/已修复"。
      from: cake-toolkit/README.md 硬约束 2

# ---------------------------------------------------------------- 目标与验收 gate
goals:
  primary: 在保持精度达标前提下显著提高 VC-Attention 算子性能。
  final_acceptance: 目标视频模型固定 prompt/seed 的生成结果正常 (端到端, 当前阶段不做)。
  current_stage: 先完成算子数值与性能闭环。

gates:
  - id: G1
    layer: 独立 CPU oracle
    criterion: 对选定 payload / 舍入 / 在线归约契约的同契约 rRMSE <= 1%
    note: 该 1% 是同契约实现门限, 不是端到端模型质量门限。
  - id: G2
    layer: 相对 dense
    criterion: 相对 dense BF16/FP32 与旧实现的误差, 按行/头及最大/分位统计
    note: 阈值随候选单独设定并记录, 不复用 G1 的 1%。
  - id: G3
    layer: 整网
    criterion: 固定 prompt/seed/模型配置的视频与整网精度
    status: 未开始
  - id: G4
    layer: 确定性
    criterion: 固定 payload 重复调用与新鲜预处理一致性 <= 0.1%
    from: vc-attention/ASCEND_910B.md

