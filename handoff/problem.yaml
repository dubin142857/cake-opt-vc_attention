  - id: F153
    t: 2026-10-28
    kind: law
    title: "经验律: 竞态触发率随 **AIV 相对 AIC 的速度** 单调上升"
    measured_same_probe:
      - {build: h15, tile_m: 32, expcast: 1, trials: 47, hits: 0,  rate: "0.0%"}
      - {build: h15, tile_m: 32, expcast: 0, trials: 47, hits: 4,  rate: "8.5%"}
      - {build: h15, tile_m: 64, expcast: 0, trials: 23, hits: 0,  rate: "0%"}
      - {build: h26b, tile_m: 32, expcast: 0, trials: 23, hits: 23, rate: "100%"}
    reading: >
      expcast 与 tile_m=64 都是**加重 AIV**, 两者都把触发率压到 0;
      h26b 相对 h15 是**AIV 被优化得更快**, 触发率升到 100%。
    registered_prediction_was_wrong: >
      ★我在看结果**之前**写下的预测是"若机理为 AIC 覆写 AIV 未读完的缓冲,
      则加重 AIV 应抬高触发率"。实测方向相反, 该机理被证伪。
      这条预测先行的做法值得保留: 否则 0% 这个结果同样能被事后编进任何故事。
    mechanism_implied: >
      AIC 的代码序是  mmq.IterateAll -> mmq.End -> S_READY ->
      CrossCoreWaitFlag(P_READY) -> mmv.IterateAll。
      AIV 慢时 AIC 阻在 P_READY 上, **把 mmq 与 mmv 在时间上分开**;
      AIV 快时该等待立即返回, 两个 matmul 背靠背发出。
      而 mmq.End() 只做 FIX_M (挡住 M 流水), **不挡 MTE1** ——
      mmv 的 L0A/L0B 装载可以在 mmq 仍在读 L0 时发出, 两者又共用物理 L0 (F151)。

