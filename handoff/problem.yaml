      这四批数据**全部在动手前就已经在仓里**, 每次都是"提了方案才去读", 于是每读一批就翻一次。
      ★规则: 提优化方案之前, 先把仓里**已有的**测量产物读完, 并明确写出"binding pipe 是哪条、
