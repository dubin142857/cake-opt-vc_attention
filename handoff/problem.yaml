  - id: F179
    t: 2026-10-29
    kind: tool
    title: "shipcheck S11: 文档引用了磁盘上有、但 git 不跟踪的文件; 自检当场抓出我自己的两个 bug"
    gap_it_closes: >
      已有的 S4 查"文档引用了包内**不存在**的文件", 但它看的是文件系统。
      而交付走 git 分支/clone —— **未跟踪但未被忽略**的文件在你机器上有、对方 clone 之后没有。
      `is_shipped` 只问"被不被忽略" (git_ignored 本仓只有 11 项), 于是把这类文件判成"会随包走"。
      本机实测: results/mindie_laser_quant_compare.json 被交付文档引用, 不在忽略集,
      is_shipped 判 True, 而 git 实际不跟踪它; 同类文件该仓有 2059 个。
    design: >
      S11 与 S4 **互不重叠**: S4 报"磁盘上就没有", S11 报"磁盘上有、clone 之后没有"。
      两者下一步不同 —— S4 补文件或改引用, S11 是 `git add` (或声明"仅本地"并说明)。
      ★**不动 is_shipped 的语义** —— 它被 S2/S3/S4/S5/S9/S10 用来定扫描范围,
      把那 2059 个翻成"不随包"会让那几条判据的覆盖面反而缩小。只新增一个事实来源。
    selftest_caught_two_bugs_of_mine: >
      ★这条判据第一版**根本不会红**。补了四条自检 (负例 / git add 后不得再报 /
      非 git 仓不得报 / 与 S4 互斥) 之后当场抓出两个 bug, 两个都是我写的:
      **(一) 夹具没有 .py**: `check()` 在包内无 .py 时于 **S0 提前返回**, S4/S11 这些
        面向文档的判据根本不跑。★这不只是夹具问题 —— 当天我在纯文档目录 delivery/ 上
        跑 shipcheck 正是停在 S0, 所以**即便有 S11 那条死引用当时也不会被抓到**。
        已把这条作用域限制写进判词: pkg 要给含源码的那一层。
      **(二) git_untracked 照着 git_ignored 抄了缓存**: 自检第 0 例在 git init **之前**
        调过一次 check(), 把空集缓存了下来。更要紧的是**生产里也错**: 未跟踪状态会随
        `git add` 改变, 而 `git add` 正是本判据要人去做的那个动作 —— 缓存它等于
        "修完了还报, 或没修却不报"。已去掉缓存 (代价: 每次 check 多一次 git 调用, 毫秒级)。
    second_corpus_validation: >
      在真仓 (vc-attention) 上跑, 命中 **9 份文档**, 含动因案例:
        delivery/PERF_COMPARISON.md -> ['results/ascend910b_benchmark.json',
                                        'results/mindie_laser_quant_compare.json']
      ★比我原先知道的更多: 交付文档里是**两条**死引用不是一条 ——
      ascend910b_benchmark.json 是精度数字 2.98%/4.36% 的出处, 同样未被跟踪。
      另有 ASCEND_910B.md 的 4 条、MINDIE_LASER_*.md 各 1 条, 以及 vc-verify/ 下的副本。
    lesson: >
      ★**一条没有自检的判据, 和没有这条判据是一样的** —— 而且更糟, 因为它看起来有。
      本条若不补自检就提交, 会是一条永远绿的摆设, 而 opdbg --mutation 要到下次扫才发现。
      与 F177 的 E12 同向: 知识/判据必须自带可执行验证。

  - id: F180
    t: 2026-10-29
    kind: tool
    title: "shguard S17: 按字节截断会产出非法 UTF-8 而让下游 grep 静默失效; 第二语料当场抓出判据过宽"
    why_a_criterion_and_not_just_a_fix: >
      F179/钩子那次只修了**这一个**实例。S17 是为了抓**下一个** —— dual-loop 的沉淀
      不是修复, 是让同类缺陷下次自己浮出来。
    what_it_flags: >
      shell 脚本里的 `cut -c` / `cut -b` / `head -c` (GNU 实现都按字节切)。
      后果不是输出难看: 非法字节会让**下游 grep 把整份输出当二进制**, 静默不匹配且 rc=1,
      于是「没找到」与「真的没有」无法区分 —— 检查本身静默失效, 比检查失败更难发现。
    grading_rule: >
      分级用两个可测信号, 不靠猜:
        (1) 脚本自身含非 ASCII -> 它处理的数据很可能也含 -> 错误级;
        (2) **但**同一行里若有已知只产 ASCII 的来源 (sha*sum / md5sum / git rev-parse /
            git describe / uuidgen / date + / xxd / hexdump / od - / base64 / wc -)
            -> 切的是纯 ASCII -> 降为提示级。
    second_corpus_caught_my_overbroad_rule: >
      ★第一版只有信号 (1)。在第二语料 (vc-attention) 上扫出一条命中:
      scripts/bench_pairwise.sh:62 的 `sha256sum ... | cut -c1-16` —— 脚本有 32 行中文
      (都是 echo 提示), 但那条流水线喂的是 sha256 十六进制串。**这是误报, 而且是错误级。**
      本仓自己的教训写着"全量设闸会训练出 --no-verify", 过宽的判据正是那条路。
      据此加了信号 (2), 并补一条自检 (含中文的脚本里切 sha256 -> 只提示)。
      复验: 两仓全树错误级 S17 命中 **0**; 那条误报降为提示级。
    decisive_validation: >
      ★拿**修复前**的钩子 (备份) 跑 S17: 命中第 **146** 行、**错误级** —— 正是今天那个
      缺陷所在的行; 修复后的现版 **0 命中**。即该判据抓得住它被建出来要抓的那个东西。
    selftest: "6 条 (2 负例 / 4 正例, 含两条分级断言与一条'改对之后不得再报'), shguard 自检 74 条 0 未过。"
    a_mistake_of_mine_in_the_same_round: >
      白名单正则多转义了一层, 写进文件的是 `\\d` (字面反斜杠+d) 而不是 `\d`,
      于是降级规则完全不生效。**自检当场红**, 查编译出来的 pattern 才看出来。
      教训: 多层字符串嵌套里写正则, 要把**编译后的 pattern 打出来看**, 不能只看源码。
    lesson: >
      ★**新判据必须在第二语料上验, 而且要看它误报了什么, 不只是看它命中了什么。**
      本条若只在本仓验, 会带着一条错误级误报上线; 而误报的代价是判据被整体绕过。

  - id: F181
