  - id: F169
    t: 2026-10-28
    kind: fix
    title: "长期未过 7 条 -> 5 条: 两条是真 bug, 修了; 根因都是「arch 目录有两套命名」"
    triage_first: >
      七条里六条模块级 (opgen / opgen.api / trust / attnplan / dslir / aprof) 加 dslapi,
      **昨天已用受控对照定过归属** —— 在推送前的远端状态 627f04c 上跑同一条命令,
      未过集合一字不差, 归属 cake/master。重做那个归属没有价值。
      真正没定过的是两条**行内**的: G1 的 api.API5 负例没抓住、G5 的 regbase_simd_vf。
      逐条查下来, 两条是同一个根因, 而且都是本仓自己的问题。
    root_cause: >
      `asc/impl/.../<arch>` 这类按架构分档的目录有**两套命名**:
      NpuArch 数字 (3510) 与编译器码名 (c310 / c220 / m200)。
      本机 CANN 换包后, 实际存在的是 dav_c100 c220 c310 m200 m300 m310 —— **没有 dav_3510**。
      实测 63 个 platform ini: 按码名命中 57 个, 按数字命中 **0 个**, 6 个都不中。
      而判据写于 2026-09-30, 那时的包里 dav_3510 存在且 32 个 ini 按数字命中。
    two_fixes:
      opgen_api_API5: >
        负例期望 950PR 按 NpuArch 命中 dav_3510, 实际按码名命中 dav_c310 ——
        **期望过期**, 不是代码回归。更新期望并把新测量补进证据块 (旧测量保留, 它是
        另一个安装包上的真实观测)。★牙没松: 注入"只试第一条候选"后该负例照样红。
      opgen_gate_G5: >
        socspec.paradigms 只 glob `regbase/<NpuArch 数字>`, 本机 regbase/3510 命中 0 处
        而 regbase/c310 有 17 处 —— 于是 950 家族的 regbase_simd_vf 被探成 False,
        **而它实际存在**。这是**真 bug** 不是期望过期。改为两套命名都试, 并在证据里
        写明命中的是哪一条。★牙确认: 把码名表清空 (等于只试数字那套) 后 G5 立刻红、rc=1。
    result: "判据自检 7 条未过 -> 5 条; 登记表 9 -> 7 条 (opgen / opgen.api 两条已修, 删除)。"
    remaining_five: >
      trust / attnplan / dslir / aprof / dslapi —— 归属均为 cake/master, 登记项写明了
      受控对照的做法与日期; dslir/dslapi 是 Python 3.11 下 ast.parse 即报 SyntaxError,
      与本侧无关。未动。
    lesson: >
      ★"长期未过"不等于"别人的问题"。这七条挂了一天多, 而其中两条是本仓自己的 bug,
      只是被"归属 cake/master"的登记项盖住了 —— 登记的是**模块级 rc**,
      而真正的失败在模块内部某一条负例上, 登记项没有那个粒度。
      定归属要定到**哪一条判据**, 不能只定到哪个模块。

