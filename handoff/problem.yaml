        tile_m=32: max_tmp 4096 / sum_tmp 8192 -> reduce_bytes 8192, 合计 68224, 空闲 128384
        tile_m=64: max_tmp 8192 / sum_tmp 16384 -> reduce_bytes 16384, 合计 135424, 空闲 **61184**
      ref: "scratchpad/reduceprobe.cpp, 链接库清单抄自 core/mmprobe.py 的 _LIBS"
    consequence: >
