            WholeReduceSum<T,false>(dst[i*248], src[i*248*padLast],
                                    MASK_PLACEHOLDER, 248, 1, 1, padLast/elePerBlk);
        else
            ReduceSumInLargeLast<T,isReuseSource>(..., tmpBuf, ...);   // 多步 + tmp 搬运
      ★`last` 是被归约轴的长度, 我们是 **N = 128 > 64**, 故走 else 的多步路径。
      ★这正好解释了 F227 的 code_attribution 为什么把 `reduce_sum_v220_impl.h` 顶到
        117 万周期: 不是 WholeReduceSum 这条原语贵, 是它外面的编排贵。
    isReuseSource_is_a_second_lever: >
      ★同一文件里 `ReduceSumArReusedSrc` 与 `ReduceSumArUnReusedSrc` 的差别只有一处:
        传给 `ReduceSumArCompute` 的第三个参数是 `src` (原地) 还是 `tmpBuf` (另一块 UB)。
        我们传的是 `isReuseSource=false`, 走 tmpBuf 那条。
      ★旁证: 早先查 tmp 尺寸时 `GetReduceSumMaxMinTmpSize(..., isReuseSource=true)` 返回 **0**,
        与"原地、不需要暂存"吻合。
      ★但改 `isReuseSource=true` 要求 src 可被破坏 —— 现行次序是
        ReduceSum -> Cast(ph, sc) -> DataCopy(pgs), sc 在归约之后还要用。**必须先换序。**
        而 mass 必须是**取 half 之前**的 fp32 之和; Cast 不修改 sc, 故换序后该契约仍成立。
    the_design: >
      ★候选 (形参语义有本机权威样例, 不是推的 —— 见上面 ReduceSumArCompute 的那一行):
        (1) 先 `Cast(ph, sc)` + `DataCopy(pgs[slot+j], ph)`  (把 sc 腾出来)
        (2) `Add(sc[0], sc[0], sc[64], 64, ROWS, ...)`        折 128 -> 64 列, **原地**, 不要额外缓冲
        (3) `WholeReduceSum<float>(mass, sc, 64, ROWS, 1, 1, N/8)`
