           **逐位相同** —— 坐实了那条推不出来的假设: **跨步各按自己的数据宽度算**,
           dst 是 fp32 故 64 元素 = 8 个 32B 块, src 是 fp16 故 64 元素 = 4 个块。
        C3 本例**能分开**三种会静默走错的解释, 且实得一个都没命中:
           "dst 被覆写而不是累加" · "标量被当成逐元素" · "乘法没发生(a 当成 1)"。
      ★取值刻意让 `base + x*a` 在 fp32 内精确 (x 小整数, a = 0.25, base 小整数),
        于是"不逐位相同"只可能是形参或语义错, 不会是舍入 —— 这是本探针能下判决的全部依据。
    production_path_unaffected: >
      新增探针内核与生产内核同一个编译单元, 故每次都要核: 卡 4 上五条确定性摘要与基线
      **逐位一致**、0 个不确定; 141 例 passed, `decoded_reference` 最大与基线**完全相同**。
    what_remains_before_writing_E: >
