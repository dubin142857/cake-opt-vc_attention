    method: 按 F188 定下的规则, 动手前先读完已有产物。results/msprof_n128_m64 · msprof_n256_m32 · msprof_n512_m32 各 3 趟四族全采, 与 msprof_h26/control_m64 基线同法提取。
    sweep: >
