          t.set_dbL0A(1); t.set_dbL0B(1); t.set_dbL0C(1);
          // "Two sequential local matmul objects share the physical Cube memories."
      按 tile_m=64, N=256, D=128 算 L0 需求 (两个 MatmulImpl 每 tile 交替, 各占一半预算):
        L0A: QK  8 KB + PV 32 KB =  40 KB / 容量  64 KB — 双缓冲要 80 KB, **不够**
