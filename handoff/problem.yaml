  - id: F171
    t: 2026-10-29
    kind: correction
    title: "★更正交付文档的过度推广: 207 ms 不是「本设计的硬下界」"
    what_i_wrote: >
      delivery/README.md 前一句是对的、窄的 —— "任何**跨核协议**的改动都降不到
      2.03 us/tile 以下" (按 F74 的规则: 下界只能取 max(单项 pipe))。
      紧接着我写成 "**即本设计的硬下界约 207 ms**", 把**一类改动的下界**
      推广成了**整个设计的下界**; Laser 那一节又在它上面叠了
      "即便做到极限仍慢一倍以上"。两处都是过度推广。
    why_it_is_not_hard:
      - "它锁定**当前的 AIV 指令条数**, 而那不是硬件地板: F135 当时论证
         aiv_vec 2.4481 里逐元素指令的**单价**已接近峰值 (57/64 元素每周期) 省不出来,
         随后 h26 用位运算替掉 Gather, aiv_vec 降到 2.03 —— **−17% 且未动跨核协议**。
         同样的论证方式在 2.4481 上说过一次, 被一次代码改动推翻了。"
      - "F117 早已直接回答过这个问题, 结论是**不能证明逼近极限, 且证据指向相反方向**:
         同机同形状同样 24 AIC / 48 AIV, CANN FA 做完整注意力只要 142.08 ms,
         且其 cube 忙时 82.2 ms 比我们的 50.8 ms **还多 38%** —— 做更多算术却快一倍。
         差距在重叠度 (FA 2.46 / 我们 1.51)。"
    what_is_firm:
      - "下界只能取 max(单项 pipe) 这条规则 (F74) 本身成立; 207 ms 是
         **expcast 臂在当前指令条数下**的下界, control 臂的同类下界约 136 ms。"
      - "★**tile 数那条出路是关着的** (F116, 主机侧 standalone tiling 探针实测):
         M=128 即使 S 改 fp16 仍 rc=-1; N=512 被 PV 的 K<=256 挡住, 与 S 的 dtype 无关。
         这一点对 207 是**有利**的, 不是不利。"
    two_retracted_sets: >
      用户问起时提到"之前估过更低、比 CANN FA 还低"的下界 —— 确有其事, 但**已作废**:
      F112 的 fixpipe 受限 193.2 ms 及其杠杆 129 / 161 ms, 建立在"时间由搬运字节决定"
      的模型上, 而 F115 用 m32/m64 搬运**完全相同**的字节却耗时差一倍推翻了该模型。
      文档里已写明这两组数字作废, 不要再引用。
    laser_conclusion_unaffected: >
      与 Laser 对比的结论不依赖这个数: 耗时是实测 285.46 vs 95.30 (3.0 倍, 即便乐观
      按 207 算仍 2.2 倍); 精度 2.98% vs 0.191% (约 16 倍) 与 tile 切分 / 指令条数 /
      重叠度**都无关**, 来自量化契约本身; 而能压低耗时的杠杆 (S 改 fp16) 恰被精度闸
      拦着 (decoded_reference 1.1089% vs 闸门 1%, 甲方已否决过一次)。
    lesson: >
      ★**把窄结论写宽, 比写错一个数更难被发现** —— 前一句的限定词 ("跨核协议的改动")
      是对的, 读者却只会记住后一句的"硬下界"。限定词与结论要写在**同一句**里。

  - id: F172
    t: 2026-10-29
    kind: defect
    title: trust 的"长期未过"是两个独立缺陷, 登记的原因不是其中任何一个
    how_found: >
      循环本轮的增量是逐条判 `opdbg --selftest-criteria` 的 7 条未过属于真失败还是
      登记失配。trust 的登记写的是"登记失配 —— 远端在 c92f3d0..627f04c 之间把
      _known_failing.json 由 10 条改成 6 条"。实测该归因**不成立**: 它解释不了 rc=1。
    defect_1_C7_pinned_the_checkout_directory_name:
      symptom: '★不过 C7: preset 至少给出仓根 (换台机器 CANN 没了也要能扫仓内引用): 得 False, 期望 True'
      cause: >
        断言写的是 `any(r.endswith("op_debug_agent") for r in _cite_preset_roots())`
        —— 钉的是本仓**当年的签出目录名**。本仓已改名 cake-toolkit, 于是必然为假。
        被判的函数 `_cite_preset_roots` 一直是对的, 它返回的最后一项就是仓根。
      second_finding: >
        ★这条断言的标签写着"换台机器 CANN 没了也要能扫仓内引用", 而本机 CANN 齐全,
        **缺 CANN 那一路从没被进过**, 断言在那个维度上恒真。标签承诺的事一次也没测。
      fix: >
        改成按路径比 (`_REPO in _cite_preset_roots()`), 并补两条真的走缺 CANN 那一路:
        把 ASCEND_HOME_PATH 指向不存在的目录 + 把 `/usr/local/Ascend/cann-*` 的 glob
        打掉, 断言 (a) 仓根仍在表里 (b) 不许留下 Ascend 下的坏 root。
      mutation_proof:
        - "去掉 `out.append(repo)` -> (a) 两条正例变红, 负例保持绿 (互不误报)"
        - "把缺 CANN 时的回落改成硬编码 `/usr/local/Ascend/cann-9.0.0` -> 负例变红, 两条正例保持绿"
    defect_2_a_SystemExit_truncated_the_selftest:
      symptom: 'rc=1 而 stdout 里 0 条未过, 且**没有**收尾的 `trust 自检: N 条, M 条未过`'
      cause: >
        `_selftest` 第 1229 行 `doc_numbers(_d)` -> `aprof.coverage()` ->
        `binary_colnames()`, 字节数不符时 `raise SystemExit`, 直接从自检**中间**穿出去。
        后面 7 条 num: 断言 + `load_refs` 那条 + 收尾统计行**一条都没跑**;
        外面只看到 rc=1, 被当成"某条判据不过"登记了一天多。
      same_disease_as: F170 (aprof 的硬编码 CANN 路径崩掉自己的自检, 掩掉 12 条断言)
      fix: >
        按本文件上面 libprofapi 那处的既有写法, 把 num: 整块放进条件 + 内层 try,
        跳过时**显式报条数与原因**, 让后面的断言照跑。
      mutation_proof: "把探针改成谎报 True -> 内层 try 兜住, 自检仍跑完 120 条 rc=0"
    why_the_byte_gate_is_NOT_re_stamped: >
      ★闸是对的, 不能为了变绿而重钉。所钉的 9251896 是 cann-9.1.0-beta.1 那份, 该包
      **已从本机撤掉**; tool_path 只解得到 cann-9.0.0 的 9120712。实测两份**列面确实不同**:
      (a) `^aic_(vec|ub)` 在 9.0.0 全集里只有 19 条, 而 08 §3.81 记的"59 列里 20 列"
      属于这一族 —— 子集 20 > 全集 19, 矛盾;
      (b) `--colorder` 3768 vs §3.81 记录的 4039 (差 271)。两项都与产物无关。
      重钉会让 201/142/59 与 4039 这些数失去依据。
    a_measurement_error_of_mine: >
      中途我报过"§3.81 点名的三条零散列一条都不在", 错的 —— 全集里的名字**带单位后缀**
      (`aic_l2_cache_hit_rate(%)` / `aiv_ub_write_bw_gm(GB/s)` / `aiv_scalar_wait_id15_time(us)`),
      文档引用时省掉了, 我按文档的拼法直接比。三条都在。
      教训: 比对两个集合之前先确认**两边的命名规范化口径一致**。
    second_precondition_the_probe_cannot_see: >
      变异检验顺带量出: 即便字节数相符, 这 7 条在本检出上**仍会红** —— fixture 里写的
      `59` 就是 `cov["never"]`, 而 never 依赖 runs/ 与 cases/*/runs/ 两棵产物树;
      本检出产物树为空 -> appeared 0 / never 201, doc_numbers 报 2 条而不是 1 条。
      所以跳过信息只陈述探针查过的那一项, **不声称它是唯一的拦路者**。
    result: "trust 自检 120 条 0 条未过 rc=0; 全量未过 7 -> 4 (attnplan 2 / dslir / dslapi / aprof); 登记表 7 -> 6 条"
    lesson: >
      ★**归因必须落到单条断言上**。"trust rc=1" 这个粒度上, 一个假的归因
      ("远端改了登记表") 能稳稳挂一天多, 因为它在那个粒度上不可证伪。
      落到断言一级, 两个毫不相干的缺陷当场分开。这与 F170 是同一条, 第二次撞。

  - id: F173
    t: 2026-10-29
    kind: fact
    title: 同一仓里有四种自检失败标记, 跨模块扫描会漏 (2026-10-29 由两种订正为四种)
    fact: >
      已实测到**四种**: (1) `★不过` —— trust / detsync_lint / hangdiag 等;
      (2) `✗` —— aprof; (3) `ok ` / `FAIL` 行首 —— dslapi;
      (4) `SELFTEST-RESULT <模块> FAIL rc=N` —— opdbg 聚合层自己的行。
      ★两次被它绊到: 查 aprof 的 18 条时按 `★不过` grep 得 0 条而收尾行写着 18;
      查 dslir/dslapi 时按 `^\[FAIL\]` grep 不到, 以为聚合"根本没跑它们",
      实际第 2344/2373 行明写着 FAIL。
    correction_of_my_own_claim: >
      F173 初版写的是"两种", 当天就被第三、第四种推翻。**"我见过的全部"不等于"全部"** ——
      当时只扫了手头正在看的两个模块就下了数量结论, 没有对全体模块做一次枚举。
    impact: 只影响人工/脚本按标记扫描; `opdbg --selftest-criteria` 的聚合读的是 rc, 不受影响。
    not_fixed_this_round: >
      统一标记要改十几个模块的打印, 且会让历史输出与文档里的引用对不上。
      先记为已知事实, 不在本轮动。

  - id: F174
    t: 2026-10-29
    kind: defect
    title: dslir 与 dslapi 的登记原因都不成立; 两者是互不相干的两个缺陷
    how_found: >
      接 F172 的做法, 把 --selftest-criteria 剩下的两条未过落到单条断言一级。
