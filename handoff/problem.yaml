      bitwise: "32/32 与 h25 逐位相同"
      accuracy: "scripts/validate_ascend910b.py 全量 status: passed"
      expcast: "五闸全过; 效应 -7.44%; 摆幅 0.01%; 空载半带宽 0.15%; G5 两会话 -7.44%/-7.43%, 极差 0.01%"
      control: "G1 未过 (0.10% < 0.15%), G5 **不适用** (真值为零) -> 不可分辨"
    protocol: "每进程协议, 每产物每会话 4 趟, 臂序 ABBA 且两会话**相反**, 中间隔一次 h25 原样重建"
