      ★**没有一条是免费的**: 免费项合计只有 81920, 缺口 58368 必须由有价项补。
    decision: >
      ★**回退增量 1**。回归确认 fixed core 逐趟 [205.04, 205.06, 204.87] (与改动前区间重叠),
        dense RMSE **2.979952 %** 与记录逐位一致, expcast 293.99 ms。
      ★`payload_reference` 的 `score_dtype` 旋钮**保留**且默认回到 None (提交 334dc65),
